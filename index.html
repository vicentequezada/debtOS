/* Preview en vivo: muestra cómo quedará la cuota después del pago */
function updateInstPayPreview(amortId) {
  const amort = S.amorts.find(a => a.id === amortId);
  if (!amort) return;
  const el = document.getElementById('ip-preview');
  const chk = document.getElementById('ip-markpaid');
  if (!el) return;

  const amount = parseFloat(document.getElementById('ip-amt')?.value) || 0;
  const partSel = document.getElementById('ip-part');
  const partId = partSel ? partSel.value : null;
  const parts = S.parts.filter(p => p.debt_id === amort.debt_id);

  if (amount <= 0) { el.innerHTML = ''; if (chk) chk.checked = false; return; }

  const cuotaTotal = +amort.total || 0;
  const allInstPaysAmort = S.instPayments.filter(p => p.amort_id === amortId && Fin.isApproved(p));
  const totalPaidNow = allInstPaysAmort.reduce((s, p) => s + (+p.amount || 0), 0);
  const totalAfter = totalPaidNow + amount;
  const willBeFull = totalAfter >= cuotaTotal * 0.99;
  const willBePartial = totalAfter > 0 && !willBeFull;
  const remainingAfter = Math.max(0, cuotaTotal - totalAfter);

  // Auto-marcar como pagada si va a quedar full
  if (chk) chk.checked = willBeFull;

  // Si hay participante, calcular si pagó de más
  let overpayWarning = '';
  if (partId && parts.length >= 2) {
    const part = parts.find(p => p.id === partId);
    const expPart = cuotaTotal * ((+part.pct || 0) / 100);
    const paidByPart = allInstPaysAmort.filter(p => p.part_id === partId).reduce((s, p) => s + (+p.amount || 0), 0);
    const totalAfterPart = paidByPart + amount;
    const overpay = totalAfterPart - expPart;
    if (overpay > 0.01) {
      // Está pagando lo de otros participantes
      const others = parts.filter(p => p.id !== partId);
      const othersList = others.map(p => p.name).join(', ');
      overpayWarning = `
        <div class="alrt aw" style="font-size:11.5px;margin-top:8px">
          <div style="font-weight:600;margin-bottom:3px">⚠️ ${part.name} está pagando de más</div>
          <div>Su parte era <strong>${Fin.fmt(expPart, true)}</strong> pero está aportando <strong>${Fin.fmt(totalAfterPart, true)}</strong> (excedente: <strong>${Fin.fmt(overpay, true)}</strong>).</div>
          <div style="margin-top:4px;color:var(--tx3)">Esto se registrará automáticamente como deuda interna: <strong>${othersList}</strong> le deberá${others.length>1?'n':''} a ${part.name} en el módulo de Participantes.</div>
        </div>
      `;
    }
  }

  let stateBadge;
  if (willBeFull) {
    stateBadge = `<div class="alrt as_" style="font-size:11.5px"><strong>✅ Después de este pago, la cuota quedará COMPLETAMENTE PAGADA</strong> (${Fin.fmt(totalAfter, true)} / ${Fin.fmt(cuotaTotal, true)}).</div>`;
  } else if (willBePartial) {
    stateBadge = `<div class="alrt aw" style="font-size:11.5px"><strong>◐ Después de este pago, la cuota quedará PARCIAL</strong>: ${Fin.fmt(totalAfter, true)} / ${Fin.fmt(cuotaTotal, true)} · falta <strong class="txt-rd">${Fin.fmt(remainingAfter, true)}</strong>.</div>`;
  } else {
    stateBadge = '';
  }
  el.innerHTML = stateBadge + overpayWarning;
}

async function saveInstPayment(debtId, amortId, partId) {
  const amt   = parseFloat(document.getElementById('ip-amt').value);
  const date  = document.getElementById('ip-date').value;
  const notes = document.getElementById('ip-notes').value.trim();
  const file  = document.getElementById('ip-receipt')?.files[0];
  const markForce = document.getElementById('ip-markpaid').checked;
  const selP  = partId || document.getElementById('ip-part')?.value || '';
  if (!amt || !date) { const e = document.getElementById('ip-err'); e.textContent = 'Monto y fecha requeridos'; e.classList.remove('hidden'); return; }
  const pp = selP ? S.parts.find(p => p.id === selP) : null;

  // Detectar si después de este pago la cuota queda completa
  const amort = S.amorts.find(a => a.id === amortId);
  const cuotaTotal = +amort?.total || 0;
  const allInstPaysAmort = S.instPayments.filter(p => p.amort_id === amortId && Fin.isApproved(p));
  const totalPaidNow = allInstPaysAmort.reduce((s, p) => s + (+p.amount || 0), 0);
  const willBeFull = (totalPaidNow + amt) >= cuotaTotal * 0.99;
  const shouldMark = markForce || willBeFull;

  // Detectar si el participante está pagando MÁS de su parte (creando deuda interna)
  let overpayInfo = null;
  if (pp && cuotaTotal > 0) {
    const expPart = cuotaTotal * ((+pp.pct || 0) / 100);
    const paidByPart = allInstPaysAmort.filter(p => p.part_id === pp.id).reduce((s, p) => s + (+p.amount || 0), 0);
    const totalAfterPart = paidByPart + amt;
    const overpay = totalAfterPart - expPart;
    if (overpay > 0.01) {
      overpayInfo = { overpay, partName: pp.name };
    }
  }

  try {
    let receiptUrl = null;
    if (file) {
      UI.toast('📤 Subiendo comprobante...', 'success');
      receiptUrl = await DB.uploadReceipt(file, debtId);
    }
    await DB.createInstPayment({ debt_id: debtId, amort_id: amortId, part_id: selP || null, user_id: pp?.user_id || user.id, amount: amt, paid_date: date, notes, receipt_url: receiptUrl });
    if (shouldMark) await DB.markAmortPaid(amortId, date);
    UI.cm(); updateBadge(); go('amort', debtId);

    let toastMsg = `✅ ${Fin.fmt(amt)} registrado${pp ? ' para ' + pp.name : ''}${receiptUrl?' · 📎':''}`;
    if (willBeFull && !markForce) toastMsg += ' · cuota COMPLETADA';
    else if (!willBeFull && totalPaidNow + amt > 0) toastMsg += ' · cuota PARCIAL';
    UI.toast(toastMsg);

    if (overpayInfo) {
      setTimeout(() => UI.toast(`⚖️ ${overpayInfo.partName} aportó ${Fin.fmt(overpayInfo.overpay)} de más. Ve a Participantes para ver el balance.`, 'warn'), 800);
    }
  } catch (e) {
    const el = document.getElementById('ip-err'); el.textContent = e.message || 'Error al guardar';
    el.classList.remove('hidden');
  }
}

async function confirmDeleteInstPay(paymentId, amortId) {
  const p = S.instPayments.find(x => x.id === paymentId);
  if (!p) return UI.toast('Pago no encontrado', 'error');
  if (!confirm(`¿Eliminar este pago de ${Fin.fmt(p.amount)}?\n\nEsta acción no se puede deshacer.`)) return;
  try {
    const debtId = p.debt_id;
    await DB.deleteInstPayment(paymentId);
    UI.cm(); updateBadge(); go('amort', debtId);
    UI.toast('🗑 Pago eliminado', 'warn');
  } catch (e) {
    UI.toast('❌ Error: ' + (e.message || 'desconocido'), 'error');
  }
}

// Preview en vivo de la distribución mientras escribes el monto
function updateGpPreview(debtId) {
  const amt = parseFloat(document.getElementById('gp-amt')?.value) || 0;
  const distChk = document.getElementById('gp-distribute');
  const preview = document.getElementById('gp-preview');
  const info    = document.getElementById('gp-info');
  const debt    = S.debts.find(d => d.id === debtId);
  const rem     = Fin.remaining(debt);

  if (info) info.textContent = amt > 0 ? `Saldo después: ${Fin.fmt(Math.max(0, rem - amt))}` : '';

  if (!preview || !distChk) return;
  if (!distChk.checked || amt <= 0) { preview.innerHTML = ''; return; }

  const plan = Fin.planPaymentDistribution(debtId, amt);
  if (!plan.allocations.length && plan.extraAmount <= 0) { preview.innerHTML = ''; return; }

  const rows = plan.allocations.map(a => {
    const stChip = a.willComplete
      ? '<span class="chip cgn">✓ Completa</span>'
      : '<span class="chip cam">⊘ Parcial</span>';
    return `<tr>
      <td>Cuota #${a.n} <span style="color:var(--tx3);font-size:10px">(${a.due})</span></td>
      <td class="tdn" style="font-size:11px;color:var(--tx3)">${Fin.fmt(a.owed)}</td>
      <td class="tdn fw7 txt-gn">${Fin.fmt(a.allocated)}</td>
      <td>${stChip}</td>
    </tr>`;
  }).join('');

  const extraRow = plan.extraAmount > 0.005
    ? `<tr style="background:rgba(245,158,11,.08)">
        <td colspan="2" style="font-style:italic;color:var(--am)">💰 Excedente (sin cuota específica)</td>
        <td class="tdn fw7 txt-am">${Fin.fmt(plan.extraAmount)}</td>
        <td><span class="chip cam">Extra</span></td>
      </tr>` : '';

  preview.innerHTML = `<div style="background:var(--bg3s);border:1px solid var(--bd);border-radius:6px;padding:8px 10px">
    <div style="font-size:10px;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-weight:600">📊 Distribución prevista</div>
    <table style="width:100%;font-size:11px;min-width:auto">
      <thead><tr><th style="padding:4px 6px;font-size:9px">Cuota</th><th style="padding:4px 6px;font-size:9px" class="tdn">Falta</th><th style="padding:4px 6px;font-size:9px" class="tdn">Aplicado</th><th style="padding:4px 6px;font-size:9px">Estado</th></tr></thead>
      <tbody>${rows}${extraRow}</tbody>
    </table>
  </div>`;
}

async function saveGenericPay(debtId) {
  const amt   = parseFloat(document.getElementById('gp-amt').value);
  const date  = document.getElementById('gp-date').value;
  const notes = document.getElementById('gp-notes').value.trim();
  const file  = document.getElementById('gp-receipt')?.files[0];
  const distribute = document.getElementById('gp-distribute')?.checked;
  const isLoanToHolder = document.getElementById('gp-loan-holder')?.checked || false;
  if (!amt || !date) { const e = document.getElementById('gp-err'); e.textContent = 'Monto y fecha requeridos'; e.classList.remove('hidden'); return; }
  document.getElementById('bgp').disabled = true;
  try {
    let receiptUrl = null;
    if (file) {
      UI.toast('📤 Subiendo comprobante...', 'success');
      receiptUrl = await DB.uploadReceipt(file, debtId);
    }
    const debt = S.debts.find(d => d.id === debtId);
    const isIn = Fin.isIncoming(debt);

    if (distribute) {
      // Modo distribución: aplica en cuotas y/o crea excedente
      const { plan, created } = await DB.applyDistributedPayment(debtId, amt, {
        date, notes, receipt_url: receiptUrl,
        user_id: user.id,
        status: 'approved', reported_by: 'owner',
        is_loan_to_holder: isLoanToHolder,
      });
      UI.cm(); updateBadge(); go(S.view, S.selDebt);
      const completed = created.markedPaid.length;
      const partial   = plan.allocations.filter(a => !a.willComplete).length;
      const extra     = plan.extraAmount > 0.005;
      let msg = `${isIn?'📥 Cobro de':'Abono de'} ${Fin.fmt(amt)} aplicado`;
      const parts = [];
      if (completed) parts.push(`${completed} cuota${completed>1?'s':''} pagada${completed>1?'s':''}`);
      if (partial)   parts.push(`${partial} parcial`);
      if (extra)     parts.push(`${Fin.fmt(plan.extraAmount,true)} excedente`);
      if (parts.length) msg += ` · ${parts.join(', ')}`;
      if (isLoanToHolder) msg += ` · 💵 cobrable al titular`;
      UI.toast(msg);
    } else {
      // Modo clásico: solo registra pago genérico
      try {
        await DB.createGenericPayment({ debt_id: debtId, user_id: user.id, amount: amt, payment_date: date, notes, receipt_url: receiptUrl, is_loan_to_holder: isLoanToHolder });
      } catch (perr) {
        // Fallback: si la columna is_loan_to_holder no existe en payments
        if (/is_loan_to_holder.*column|column.*is_loan_to_holder|schema cache/i.test(perr.message || '')) {
          if (isLoanToHolder) UI.toast('⚠️ Tu base no tiene "is_loan_to_holder". Ejecuta el SQL. El pago se guarda sin marcar como préstamo.', 'warn');
          await DB.createGenericPayment({ debt_id: debtId, user_id: user.id, amount: amt, payment_date: date, notes, receipt_url: receiptUrl });
        } else throw perr;
      }
      UI.cm(); go(S.view, S.selDebt);
      UI.toast(`${isIn?'📥 Cobro de':'Abono de'} ${Fin.fmt(amt)} registrado${receiptUrl?' · 📎':''}${isLoanToHolder?' · 💵 cobrable al titular':''}`);
    }
  } catch (e) { const el = document.getElementById('gp-err'); el.textContent = e.message || 'Error'; el.classList.remove('hidden'); document.getElementById('bgp').disabled = false; }
}

// Buscar pago por ID en cualquiera de las dos tablas
function findPayment(id) {
  const inst = S.instPayments.find(p => p.id === id);
  if (inst) return { ...inst, _table: 'installment_payments', _kind: 'inst' };
  const gen = S.payments.find(p => p.id === id);
  if (gen) return { ...gen, _table: 'payments', _kind: 'generic' };
  return null;
}

  const isInst = p._kind === 'inst';
  const dateField = isInst ? 'paid_date' : 'payment_date';
  const date = p[dateField] || '';

        ${debt?.name || '—'} ${isInst && p.amort_id ? '· Cuota #' + (S.amorts.find(a=>a.id===p.amort_id)?.n || '?') : ''}
      </div>

      <div class="frow c2">
        <div class="fg"><label>Monto ($)</label><input type="number" id="ep-amt" value="${p.amount}" min="0.01" step="0.01"></div>

async function saveEditedPayment(paymentId) {
  const p = findPayment(paymentId);
  if (!p) return UI.toast('Pago no encontrado', 'error');
  const amt   = parseFloat(document.getElementById('ep-amt').value);
  const date  = document.getElementById('ep-date').value;
  const notes = document.getElementById('ep-notes').value.trim();
  const file  = document.getElementById('ep-receipt')?.files[0];
  if (!amt || !date) { const el = document.getElementById('ep-err'); el.textContent = 'Monto y fecha requeridos'; el.classList.remove('hidden'); return; }

  const dateField = p._kind === 'inst' ? 'paid_date' : 'payment_date';
  const patch = { amount: amt, [dateField]: date, notes };

  document.getElementById('bep').disabled = true;
  try {
    if (file) {
      UI.toast('📤 Subiendo comprobante...', 'success');
      // Borrar el viejo si existía
      if (p.receipt_url) await DB.deleteReceipt(p.receipt_url).catch(()=>{});
      patch.receipt_url = await DB.uploadReceipt(file, p.debt_id);
    }
    await DB.updatePayment(p._table, paymentId, patch);
    UI.cm(); updateBadge(); go(S.view, S.selDebt);
    UI.toast('✏️ Pago actualizado');
  } catch (e) {
    const el = document.getElementById('ep-err');
    el.textContent = e.message || 'Error'; el.classList.remove('hidden');
    document.getElementById('bep').disabled = false;
  }
}

async function approvePayment(paymentId) {
  const p = findPayment(paymentId);
  if (!p) return;
  const note     = document.getElementById('ep-rnote')?.value.trim() || null;
  const amtEl    = document.getElementById('ep-amt');
  const dateEl   = document.getElementById('ep-date');
  const notesEl  = document.getElementById('ep-notes');
  const distChk  = document.getElementById('ep-distribute');
  const distribute = distChk && distChk.checked && p._kind === 'generic';

  // Valores finales (puede haber sido editado en el modal)
  const finalAmt   = amtEl   ? parseFloat(amtEl.value) : +p.amount;
  const dateField  = p._kind === 'inst' ? 'paid_date' : 'payment_date';
  const finalDate  = dateEl  ? dateEl.value : p[dateField];
  const finalNotes = notesEl ? notesEl.value.trim() : (p.notes || '');

  if (distribute) {
    // 1) Borrar el pago pendiente original (era genérico)
    await DB.deletePayment(paymentId);
    // 2) Aplicar distribución con los datos finales
    const { plan, created } = await DB.applyDistributedPayment(p.debt_id, finalAmt, {
      date: finalDate, notes: finalNotes || 'Pago aprobado del deudor',
      receipt_url: p.receipt_url || null,
      user_id: null,
      status: 'approved', reported_by: 'borrower',
    });
    // Notas de revisión: las guardamos en cada pago creado
    if (note) {
      for (const ip of created.instPayments) await DB.updatePayment('installment_payments', ip.id, { reviewer_note: note, reviewed_at: new Date().toISOString() });
      for (const gp of created.genericPayments) await DB.updatePayment('payments', gp.id, { reviewer_note: note, reviewed_at: new Date().toISOString() });
    }
    UI.cm(); updateBadge(); go(S.view, S.selDebt);
    const completed = created.markedPaid.length;
    let msg = `✅ Pago aprobado y distribuido`;
    const parts = [];
    if (completed) parts.push(`${completed} cuota${completed>1?'s':''} pagada${completed>1?'s':''}`);
    if (plan.allocations.some(a => !a.willComplete)) parts.push('1 parcial');
    if (plan.extraAmount > 0.005) parts.push(`${Fin.fmt(plan.extraAmount,true)} excedente`);
    if (parts.length) msg += ` · ${parts.join(', ')}`;
    UI.toast(msg);
  } else {
    // Comportamiento antiguo: solo cambiar status
    const patch = {
      status: 'approved',
      reviewed_at: new Date().toISOString(),
      reviewer_note: note,
    };
    if (amtEl && finalAmt !== +p.amount) patch.amount = finalAmt;
    if (dateEl && finalDate !== p[dateField]) patch[dateField] = finalDate;
    if (notesEl && finalNotes !== (p.notes||'')) patch.notes = finalNotes;

    await DB.updatePayment(p._table, paymentId, patch);
    UI.cm(); updateBadge(); go(S.view, S.selDebt);
    UI.toast(`✅ Pago de ${Fin.fmt(finalAmt)} aprobado`);
  }
}

async function rejectPayment(paymentId) {
  const p = findPayment(paymentId);
  if (!p) return;
  const note = document.getElementById('ep-rnote')?.value.trim() || null;
  if (!note) {
    if (!confirm('¿Rechazar este pago sin dar un motivo?\nEs mejor poner un motivo para que el deudor sepa qué pasó.')) return;
  }
  await DB.updatePayment(p._table, paymentId, {
    status: 'rejected',
    reviewed_at: new Date().toISOString(),
    reviewer_note: note,
  });
  UI.cm(); updateBadge(); go(S.view, S.selDebt);
  UI.toast('Pago rechazado', 'warn');
}

function confirmDeletePayment(paymentId) {
  const p = findPayment(paymentId);
  if (!p) return;
  if (!confirm(`¿Eliminar este pago de ${Fin.fmt(p.amount)}?\nEsta acción no se puede deshacer.`)) return;
  doDeletePayment(paymentId);
}

async function doDeletePayment(paymentId) {
  const p = findPayment(paymentId);
  if (!p) return;
  // Borrar receipt del storage si existe
  if (p.receipt_url) await DB.deleteReceipt(p.receipt_url).catch(()=>{});
  if (p._kind === 'inst') await DB.deleteInstPayment(paymentId);
  else                    await DB.deletePayment(paymentId);
  UI.cm(); updateBadge(); go(S.view, S.selDebt);
  UI.toast('Pago eliminado', 'warn');
}

window._csvRows = [];
function handleCSVFile(e, debtId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const text = ev.target.result;
      const rows = parseCSV(text);
      window._csvRows = rows;
      showCSVPreview(rows, debtId);
    } catch (err) {
      const el = document.getElementById('csv-err');
      el.textContent = 'Error al leer el CSV: ' + err.message; el.classList.remove('hidden');
    }
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════
   CSV PARSER — robusto, detecta headers y formatos locales
═══════════════════════════════════════════════════════════ */
function parseCSV(text) {
  // Detectar separador (probar con la primera línea)
  const firstLine = text.split(/\r?\n/)[0];
  let sep = ',';
  // Contar candidatos
  const candidates = [
    { ch: ';', count: (firstLine.match(/;/g)  || []).length },
    { ch: '\t',count: (firstLine.match(/\t/g) || []).length },
    { ch: ',', count: (firstLine.match(/,/g)  || []).length },
    { ch: '|', count: (firstLine.match(/\|/g) || []).length },
  ];
  candidates.sort((a, b) => b.count - a.count);
  if (candidates[0].count > 0) sep = candidates[0].ch;

  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) throw new Error('CSV vacío');

  // Parsear primera línea para detectar header
  const firstCols = parseLine(lines[0], sep);
  const hasHeader = firstCols.some(c => /[a-záéíóúñ]/i.test(c.replace(/[0-9.,$\s\-\/]/g, '')) && c.length > 0);

  // Mapear columnas si hay header
  let colMap = null;
  let startIdx = 0;
  if (hasHeader) {
    colMap = mapColumns(firstCols);
    startIdx = 1;
  }

  // ─── PRE-ANÁLISIS DE FECHAS ───
  // Recorrer todas las fechas del archivo para detectar el formato.
  // Si en alguna fecha el primer número > 12, formato = DD-first.
  // Si en alguna el segundo > 12, formato = MM-first.
  // Si todas ≤ 12, no podemos distinguir → asumir DD-first (latam por defecto).
  const dateColIdx = colMap ? colMap.due : 1;
  let dateFmt = 'auto'; // 'dd-first', 'mm-first', 'iso'
  const dateSamples = [];
  for (let i = startIdx; i < Math.min(lines.length, startIdx + 50); i++) {
    const cols = parseLine(lines[i], sep);
    const raw = (cols[dateColIdx] || '').trim();
    if (raw) dateSamples.push(raw);
  }
  // Detectar si todas son ISO (YYYY-MM-DD)
  const allIso = dateSamples.length > 0 && dateSamples.every(s => /^\d{4}-\d{2}-\d{2}/.test(s));
  if (allIso) {
    dateFmt = 'iso';
  } else {
    // Mirar números 1 y 2 de cada fecha (separadores / - .)
    let firstGT12 = false, secondGT12 = false;
    dateSamples.forEach(s => {
      const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (!m) return;
      const a = parseInt(m[1]), b = parseInt(m[2]);
      if (a > 12) firstGT12 = true;
      if (b > 12) secondGT12 = true;
    });
    if (secondGT12 && !firstGT12) dateFmt = 'mm-first';      // claramente MM/DD
    else                          dateFmt = 'dd-first';      // por defecto DD/MM (latam)
  }

  const rows = [];
  for (let i = startIdx; i < lines.length; i++) {
    const cols = parseLine(lines[i], sep);
    if (cols.length < 2) continue; // línea vacía o basura
    if (cols.every(c => !c.trim())) continue;

    let n, due, cap, int_, ins, total, bal;
    if (colMap) {
      // Usar mapeo de columnas detectado
      n    = parseInt(cols[colMap.n] || '') || (rows.length + 1);
      due  = parseDate(cols[colMap.due] || '', dateFmt);
      cap  = parseNum(cols[colMap.cap] || '0');
      int_ = parseNum(cols[colMap.int_] || '0');
      ins  = colMap.ins != null ? parseNum(cols[colMap.ins] || '0') : 0;
      total= colMap.total != null ? parseNum(cols[colMap.total] || '0') : (cap + int_ + ins);
      bal  = colMap.bal   != null ? parseNum(cols[colMap.bal]   || '0') : 0;
    } else {
      // Sin header: asumir orden estándar (n, due, cap, int, [insurance], total, bal)
      n   = parseInt(cols[0]) || (rows.length + 1);
      due = parseDate(cols[1] || '', dateFmt);
      cap = parseNum(cols[2] || '0');
      int_= parseNum(cols[3] || '0');
      // Si tiene 7 columnas, asumimos que la 5ta es seguros
      const has7 = cols.length >= 7;
      ins = has7 ? parseNum(cols[4] || '0') : 0;
      const totalIdx = has7 ? 5 : 4;
      const balIdx   = has7 ? 6 : 5;
      total = cols[totalIdx] !== undefined ? parseNum(cols[totalIdx]) : (cap + int_ + ins);
      bal   = cols[balIdx]   !== undefined ? parseNum(cols[balIdx])   : 0;
    }

    // Saltar filas con datos claramente inválidos (todo en cero o sin fecha y sin monto)
    if (!due && cap === 0 && int_ === 0 && total === 0) continue;

    rows.push({ id: `csv_${Date.now()}_${i}`, n, due, cap, int: int_, insurance: ins, total, bal, paid_date: null });
  }
  if (!rows.length) throw new Error('No se encontraron filas con datos válidos. Revisa el formato del CSV.');
  return rows;
}

// Parsea una línea respetando comillas (para casos como "1.234,56")
function parseLine(line, sep) {
  const out = [];
  let cur = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' || c === "'") {
      inQuote = !inQuote;
      continue;
    }
    if (c === sep && !inQuote) {
      out.push(cur.trim());
      cur = '';
    } else {
      cur += c;
    }
  }
  out.push(cur.trim());
  return out.map(c => c.replace(/^["']|["']$/g, ''));
}

// Detecta qué columna es qué basándose en el header
function mapColumns(headerCols) {
  const norm = s => String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quitar tildes
    .replace(/[^a-z0-9]/g, ' ').trim();

  const map = { n: null, due: null, cap: null, int_: null, ins: null, total: null, bal: null };

  headerCols.forEach((h, i) => {
    const nh = norm(h);
    if (map.n === null && /(^|\s)(n|nro|num|cuota|periodo|mes|#|no|item)(\s|$)/.test(' ' + nh + ' ')) map.n = i;
    else if (map.due === null && /(vencimiento|vence|fecha|date|due|pago)/.test(nh)) map.due = i;
    else if (map.cap === null && /(capital|principal|abono cap|amortizacion)/.test(nh)) map.cap = i;
    else if (map.int_ === null && /(interes|interest|intereses)/.test(nh)) map.int_ = i;
    else if (map.ins === null && /(seguro|desgravamen|insurance|otros|comision)/.test(nh)) map.ins = i;
    else if (map.total === null && /(total|cuota|dividendo|pago mensual|valor cuota)/.test(nh)) map.total = i;
    else if (map.bal === null && /(saldo|balance|restante|capital pendiente)/.test(nh)) map.bal = i;
  });

  // Si después del primer pase faltan campos clave, intentar fallback por posición
  if (map.cap === null && headerCols.length >= 3) map.cap = 2;
  if (map.int_ === null && headerCols.length >= 4) map.int_ = 3;
  if (map.due === null && headerCols.length >= 2) map.due = 1;
  if (map.n === null) map.n = 0;
  return map;
}

function parseDate(s, fmt) {
  if (!s) return '';
  s = String(s).trim();
  // YYYY-MM-DD (ISO siempre)
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  // YYYY/MM/DD o YYYY.MM.DD
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // X/Y/Z donde X y Y son 1-2 dígitos y Z es 2-4
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let a = parseInt(m[1]), b = parseInt(m[2]);
    const y = m[3].length === 2 ? (parseInt(m[3]) > 50 ? '19' + m[3] : '20' + m[3]) : m[3];
    let day, month;
    // Si fmt es explícito, usarlo. Si no, decidir por valores.
    if (fmt === 'mm-first') { month = a; day = b; }
    else if (fmt === 'dd-first') { day = a; month = b; }
    else {
      // auto: si a > 12 → DD primero. Si b > 12 → MM primero. Si ambas ≤ 12 → DD-first (latam).
      if (a > 12) { day = a; month = b; }
      else if (b > 12) { month = a; day = b; }
      else { day = a; month = b; } // default DD/MM
    }
    // Validar que sean días/meses razonables; si no, devolver vacío
    if (day < 1 || day > 31 || month < 1 || month > 12) return '';
    return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  // DD-MMM-YYYY (ej: 15-ene-2024)
  const months = { ene:'01', feb:'02', mar:'03', abr:'04', may:'05', jun:'06', jul:'07', ago:'08', sep:'09', sept:'09', oct:'10', nov:'11', dic:'12' };
  m = s.toLowerCase().match(/^(\d{1,2})[\s\-.]([a-z]{3,4})[\s\-.](\d{2,4})$/);
  if (m && months[m[2]]) {
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${months[m[2]]}-${m[1].padStart(2,'0')}`;
  }
  return '';
}

// parseNum: maneja formato local
//  "1.234,56" → 1234.56  (formato europeo/latam)
//  "1,234.56" → 1234.56  (formato US)
//  "$1.234,56" → 1234.56
//  "1234.56" → 1234.56
//  "" o nada → 0
function parseNum(s) {
  if (s === null || s === undefined || s === '') return 0;
  let str = String(s).replace(/\s/g, '').replace(/[^\d.,\-]/g, '');
  if (!str) return 0;
  // ¿Tiene tanto punto como coma?
  const hasDot   = str.indexOf('.') !== -1;
  const hasComma = str.indexOf(',') !== -1;
  if (hasDot && hasComma) {
    // El último que aparece es el separador decimal
    if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
      // formato latam: "1.234,56" → quitar puntos, cambiar coma por punto
      str = str.replace(/\./g, '').replace(',', '.');
    } else {
      // formato US: "1,234.56" → quitar comas
      str = str.replace(/,/g, '');
    }
  } else if (hasComma) {
    // Solo coma. ¿Es decimal o miles?
    // Regla: si hay 3 dígitos después de la última coma, es separador de miles
    const parts = str.split(',');
    const last = parts[parts.length - 1];
    if (parts.length === 2 && last.length <= 2) {
      // decimal: "1234,56"
      str = str.replace(',', '.');
    } else {
      // miles: "1,234" o "1,234,567"
      str = str.replace(/,/g, '');
    }
  }
  const n = parseFloat(str);
  return isNaN(n) ? 0 : n;
}

function showCSVPreview(rows, debtId) {
  const el = document.getElementById('csv-preview');
  const btn = document.getElementById('btn-csv-import');
  if (!el) return;
  btn?.classList.remove('hidden');

  // Detectar si tiene seguros con valores
  const hasInsurance = rows.some(r => +r.insurance > 0);
  // Detectar problemas comunes
  const noDateRows = rows.filter(r => !r.due).length;
  const noTotalRows = rows.filter(r => +r.total === 0).length;
  const sumCap = rows.reduce((s, r) => s + (+r.cap || 0), 0);
  const sumInt = rows.reduce((s, r) => s + (+r.int || 0), 0);
  const sumIns = rows.reduce((s, r) => s + (+r.insurance || 0), 0);
  const sumTotal = rows.reduce((s, r) => s + (+r.total || 0), 0);

  const previewN = Math.min(8, rows.length);

  let warnings = '';
  if (noDateRows > 0)  warnings += `<div style="color:var(--am);font-size:11px;margin-bottom:4px">⚠️ ${noDateRows} fila${noDateRows!==1?'s':''} sin fecha de vencimiento — se importarán pero deberás editarlas después</div>`;
  if (noTotalRows > 0) warnings += `<div style="color:var(--am);font-size:11px;margin-bottom:4px">⚠️ ${noTotalRows} fila${noTotalRows!==1?'s':''} con total $0 — verifica el formato del archivo</div>`;

  el.innerHTML = `
  <div style="font-size:12px;color:var(--gn);margin-bottom:6px;font-weight:600">✅ ${rows.length} cuota${rows.length!==1?'s':''} detectada${rows.length!==1?'s':''}${hasInsurance?' · incluye seguros':''}</div>
  ${warnings}
  <div style="font-size:10px;color:var(--tx3);margin-bottom:8px">Sumas: capital ${Fin.fmt(sumCap, true)} · interés ${Fin.fmt(sumInt, true)}${hasInsurance?' · seguros '+Fin.fmt(sumIns, true):''} · total ${Fin.fmt(sumTotal, true)}</div>
  <div class="tw"><table style="min-width:auto;font-size:11px">
    <thead><tr><th>#</th><th>Vencimiento</th><th class="tdn">Capital</th><th class="tdn">Interés</th>${hasInsurance?'<th class="tdn">Seguros</th>':''}<th class="tdn">Total</th><th class="tdn">Saldo</th></tr></thead>
    <tbody>${rows.slice(0, previewN).map(r => `<tr>
      <td>${r.n}</td><td>${r.due||'<span style="color:var(--am)">⚠ sin fecha</span>'}</td>
      <td class="tdn">${Fin.fmt(r.cap)}</td><td class="tdn">${Fin.fmt(r.int)}</td>
      ${hasInsurance?`<td class="tdn">${Fin.fmt(r.insurance)}</td>`:''}
      <td class="tdn fw7">${Fin.fmt(r.total)}</td><td class="tdn">${Fin.fmt(r.bal)}</td>
    </tr>`).join('')}
    ${rows.length > previewN ? `<tr><td colspan="${hasInsurance?7:6}" style="text-align:center;color:var(--tx3);font-size:10px;padding:6px">... y ${rows.length - previewN} cuota${rows.length-previewN!==1?'s':''} más (todas se importarán)</td></tr>` : ''}
    </tbody></table></div>`;
}

async function confirmCSVImport(debtId) {
  if (!window._csvRows?.length) return;
  const btn = document.getElementById('btn-csv-import');
  const errEl = document.getElementById('csv-err');
  if (btn) btn.disabled = true;
  if (errEl) errEl.classList.add('hidden');
  try {
    const n = await DB.importAmortCSV(debtId, window._csvRows);
    UI.cm(); go('amort', debtId);
    UI.toast(`📥 ${n} cuotas importadas correctamente`);
    window._csvRows = [];
  } catch (err) {
    if (errEl) {
      errEl.textContent = '❌ ' + (err.message || 'Error al importar');
      errEl.classList.remove('hidden');
    } else {
      UI.toast('❌ ' + (err.message || 'Error'), 'error');
    }
    if (btn) btn.disabled = false;
  }
}

function filterPays() {
  const dId  = document.getElementById('flt-debt')?.value   || '';
  const tType= document.getElementById('flt-type')?.value   || '';
  const month= document.getElementById('flt-month')?.value  || '';

  const baseFilter = (arr, dateField) => {
    let r = [...arr];
    if (dId)   r = r.filter(p => p.debt_id === dId);
    if (tType) r = r.filter(p => S.debts.find(x => x.id === p.debt_id)?.type === tType);
    if (month) r = r.filter(p => (p[dateField] || '').startsWith(month));
    return r;
  };

  // Custom comparator: para columnas derivadas (deuda nombre, cuota, etc.)
  const cmpInst = (a, b, col) => {
    if (col === 'debt')  return (S.debts.find(d=>d.id===a.debt_id)?.name||'').localeCompare(S.debts.find(d=>d.id===b.debt_id)?.name||'', 'es');
    if (col === 'cuota') return (S.amorts.find(x=>x.id===a.amort_id)?.n||0) - (S.amorts.find(x=>x.id===b.amort_id)?.n||0);
    if (col === 'part')  return (S.parts.find(x=>x.id===a.part_id)?.name||'').localeCompare(S.parts.find(x=>x.id===b.part_id)?.name||'', 'es');
    if (col === 'amount') return (parseFloat(a.amount)||0) - (parseFloat(b.amount)||0);
    if (col === 'status') {
      const ord = p => Fin.isPending(p)?0 : Fin.isRejected(p)?2 : 1;
      return ord(a) - ord(b);
    }
    return undefined;
  };
  const cmpGen = (a, b, col) => {
    if (col === 'debt')  return (S.debts.find(d=>d.id===a.debt_id)?.name||'').localeCompare(S.debts.find(d=>d.id===b.debt_id)?.name||'', 'es');
    if (col === 'type')  return (S.debts.find(d=>d.id===a.debt_id)?.type||'').localeCompare(S.debts.find(d=>d.id===b.debt_id)?.type||'', 'es');
    if (col === 'amount') return (parseFloat(a.amount)||0) - (parseFloat(b.amount)||0);
    if (col === 'status') {
      const ord = p => Fin.isPending(p)?0 : Fin.isRejected(p)?2 : 1;
      return ord(a) - ord(b);
    }
    return undefined;
  };

  const fi = sortRows(baseFilter(S.instPayments, 'paid_date'),    S.sort.payInst, cmpInst);
  const fg = sortRows(baseFilter(S.payments,     'payment_date'), S.sort.payGen,  cmpGen);
  const ti = fi.reduce((s, p) => s + (+p.amount || 0), 0);
  const tg = fg.reduce((s, p) => s + (+p.amount || 0), 0);

  // ─── Desglose capital/interés/seguros del filtrado ───
  // Solo se calcula sobre pagos APROBADOS de cuota (los genéricos = 100% capital)
  let bdCap = 0, bdInt = 0, bdIns = 0;
  let bdHasInsurance = false;
  fi.filter(Fin.isApproved).forEach(p => {
    const a = S.amorts.find(x => x.id === p.amort_id);
    if (!a) { bdCap += +p.amount || 0; return; } // si no hay cuota, contar como capital
    const total = +a.total || 0;
    const cap   = +a.cap   || 0;
    const int_  = +a.int   || 0;
    const ins   = +a.insurance || 0;
    if (ins > 0) bdHasInsurance = true;
    if (total <= 0) { bdCap += +p.amount || 0; return; }
    const amt = +p.amount || 0;
    bdCap += amt * (cap / total);
    bdInt += amt * (int_ / total);
    bdIns += amt * (ins / total);
  });
  // Genéricos aprobados = 100% capital
  fg.filter(Fin.isApproved).forEach(p => { bdCap += +p.amount || 0; });

  // Headers
  const ith = document.getElementById('inst-thead');
  if (ith) ith.innerHTML = `<tr>
    ${sortHeader('Deuda',        'debt',      'payInst', 'filterPays')}
    ${sortHeader('Cuota #',      'cuota',     'payInst', 'filterPays')}
    ${sortHeader('Participante', 'part',      'payInst', 'filterPays')}
    ${sortHeader('Fecha',        'paid_date', 'payInst', 'filterPays')}
    <th>Notas</th>
    <th class="tdc">📎</th>
    ${sortHeader('Estado',       'status',    'payInst', 'filterPays')}
    ${sortHeader('Monto',        'amount',    'payInst', 'filterPays', 'tdn')}
    <th></th>
  </tr>`;
  const gth = document.getElementById('gen-thead');
  if (gth) gth.innerHTML = `<tr>
    ${sortHeader('Deuda',        'debt',          'payGen', 'filterPays')}
    ${sortHeader('Tipo',         'type',          'payGen', 'filterPays')}
    ${sortHeader('Fecha',        'payment_date',  'payGen', 'filterPays')}
    <th>Notas</th>
    <th class="tdc">📎</th>
    ${sortHeader('Estado',       'status',        'payGen', 'filterPays')}
    ${sortHeader('Monto',        'amount',        'payGen', 'filterPays', 'tdn')}
    <th></th>
  </tr>`;

  const kpis = document.getElementById('pays-kpis');
  if (kpis) {
    kpis.style.gridTemplateColumns = bdHasInsurance
      ? 'repeat(auto-fit,minmax(155px,1fr))'
      : 'repeat(auto-fit,minmax(160px,1fr))';
    const insKpi = bdHasInsurance
      ? UI.kc('pu', 'Seguros pagados', Fin.fmt(bdIns, true), 'desgravamen / otros', '🛡️')
      : '';
    kpis.innerHTML = `
      ${UI.kc('gn', 'Por cuota', Fin.fmt(ti, true), fi.length+' pago'+(fi.length!==1?'s':''), '📋')}
      ${UI.kc('bl', 'Abonos genéricos', Fin.fmt(tg, true), fg.length+' abono'+(fg.length!==1?'s':''), '💸')}
      ${UI.kc('cy', 'Capital pagado', Fin.fmt(bdCap, true), 'reduce deuda', '✅')}
      ${UI.kc('am', 'Interés pagado', Fin.fmt(bdInt, true), 'costo del préstamo', '💰')}
      ${insKpi}
      ${UI.kc('rd', 'Total filtrado', Fin.fmt(ti+tg, true), 'todos los pagos', '📊')}
    `;
  }

  const receiptCell = url => url
    ? `<button class="btn bghost btn-xs" onclick="viewReceipt('${url.replace(/'/g,"\\'")}')" title="Ver comprobante">📎</button>`
    : '<span class="txt-mu" style="font-size:10px">—</span>';

  const statusCell = p => {
    if (Fin.isPending(p))  return '<span class="chip cam" title="Pendiente de aprobación">⏳ Pendiente</span>';
    if (Fin.isRejected(p)) return '<span class="chip crd" title="Rechazado">✕ Rechazado</span>';
    return p.reported_by === 'borrower'
      ? '<span class="chip cgn" title="Aprobado · reportado por deudor">✓ Aprobado</span>'
      : '<span class="chip cgn">✓ OK</span>';
  };

  const it = document.getElementById('inst-tbody');
  if (it) it.innerHTML = fi.length ? fi.map(p => {
    const debt = S.debts.find(d => d.id === p.debt_id);
    const amort = S.amorts.find(a => a.id === p.amort_id);
    const pp = S.parts.find(x => x.id === p.part_id);
    return `<tr style="${Fin.isPending(p)?'background:rgba(245,158,11,.04)':''}">
      <td class="tdm">${debt?.name||'—'}</td>
      <td class="tdc">#${amort?.n||'—'}</td>
      <td>${pp ? UI.chip(pp.name,'bl') : '<span class="txt-mu">General</span>'}</td>
      <td>${p.paid_date||'—'}</td>
      <td style="color:var(--tx3)">${p.notes||'—'}</td>
      <td class="tdc">${receiptCell(p.receipt_url)}</td>
      <td class="tdc">${statusCell(p)}</td>
      <td class="tdn ${Fin.isApproved(p)?'txt-gn':'txt-mu'} fw7">${Fin.fmt(p.amount)}</td>
      <td><button class="btn bghost btn-xs" onclick="modalEditPayment('${p.id}')" title="${Fin.isPending(p)?'Revisar':'Editar'}">${Fin.isPending(p)?'⏳':'✏️'}</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--tx3);padding:22px">Sin pagos de cuota</td></tr>`;

  const gt = document.getElementById('gen-tbody');
  if (gt) gt.innerHTML = fg.length ? fg.map(p => {
    const debt = S.debts.find(d => d.id === p.debt_id);
    return `<tr style="${Fin.isPending(p)?'background:rgba(245,158,11,.04)':''}">
      <td class="tdm">${debt?.name||'—'}</td>
      <td>${debt?UI.typeChip(debt.type):''}</td>
      <td>${p.payment_date||'—'}</td>
      <td style="color:var(--tx3)">${p.notes||'—'}</td>
      <td class="tdc">${receiptCell(p.receipt_url)}</td>
      <td class="tdc">${statusCell(p)}</td>
      <td class="tdn ${Fin.isApproved(p)?'txt-gn':'txt-mu'} fw7">${Fin.fmt(p.amount)}</td>
      <td><button class="btn bghost btn-xs" onclick="modalEditPayment('${p.id}')" title="${Fin.isPending(p)?'Revisar':'Editar'}">${Fin.isPending(p)?'⏳':'✏️'}</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--tx3);padding:22px">Sin abonos</td></tr>`;
}

/* ─────────────────────────────────────────────
   BALANCE ENTRE PARTICIPANTES
   Muestra quién pagó de más y a quién le debe
   plata por haber pagado lo de otros.
   ───────────────────────────────────────────── */
function renderParticipantBalances(debtId) {
  const el = document.getElementById('participant-balances');
  if (!el) return;
  const parts = S.parts.filter(p => p.debt_id === debtId);
  if (parts.length < 2) { el.innerHTML = ''; return; }

  const debt = S.debts.find(d => d.id === debtId);
  const balances = Fin.participantBalances(debtId);
  const settlements = Fin.participantSettlements(debtId);
  const transfers = (S.participantTransfers || []).filter(t => t.debt_id === debtId)
    .sort((a,b) => (b.paid_date || '').localeCompare(a.paid_date || ''));

  // Aplicar transfers a balances para mostrar saldos finales
  const finalBal = balances.map(b => ({ ...b }));
  transfers.forEach(t => {
    const from = finalBal.find(b => b.id === t.from_part);
    const to   = finalBal.find(b => b.id === t.to_part);
    if (from && to) {
      from.balance += +t.amount || 0;
      to.balance   -= +t.amount || 0;
    }
  });

  const allSettled = settlements.length === 0;

  el.innerHTML = `
  <div class="card mb4" style="border-left:3px solid var(--am)">
    <div class="card-hd">
      <div>
        <div class="card-ti">⚖️ Balance entre Participantes</div>
        <div class="card-su">Cuando un participante paga más de su parte, los otros le deben. Aquí se rastrea para que puedas cobrar correctamente después.</div>
      </div>
      ${parts.length >= 2 ? `<button class="btn bp btn-sm" onclick="modalAddTransfer('${debtId}')">💸 Registrar pago entre participantes</button>` : ''}
    </div>

    ${allSettled
      ? `<div class="alrt as_" style="font-size:12px"><strong>✅ Todo cuadrado.</strong> Cada participante ha aportado exactamente lo que le corresponde.</div>`

  UI.modal(`<div class="mover"><div class="modal" style="max-width:500px">
    <div class="mhd"><div class="mti">💸 Pago entre participantes</div><button class="mcl" onclick="UI.cm()">✕</button></div>
    <div class="mbd">
      <div class="alrt ai" style="font-size:11.5px;margin-bottom:12px">

      </div>
      <div class="frow c2">
        <div class="fg">
          <label>Quién paga (debía)</label>

      <div class="frow c2">
        <div class="fg"><label>Monto ($)</label><input type="number" id="pt-amount" value="${suggestedAmount?(+suggestedAmount).toFixed(2):''}" min="0.01" step="0.01" placeholder="0.00"></div>

async function savePartTransfer(debtId) {
  const fromId = document.getElementById('pt-from').value;
  const toId   = document.getElementById('pt-to').value;
  const amount = parseFloat(document.getElementById('pt-amount').value);
  const date   = document.getElementById('pt-date').value;
  const notes  = document.getElementById('pt-notes').value.trim();
  const errEl  = document.getElementById('pt-err');
  const showErr = msg => { errEl.textContent = msg; errEl.classList.remove('hidden'); };

  if (!fromId || !toId) return showErr('Selecciona ambos participantes');
  if (fromId === toId) return showErr('No puede ser la misma persona');
  if (!amount || amount <= 0) return showErr('Monto inválido');
  if (!date) return showErr('Fecha requerida');

  try {
    await DB.createParticipantTransfer({
      debt_id: debtId, from_part: fromId, to_part: toId,
      amount, paid_date: date, notes: notes || null,
    });
    UI.cm();
    UI.toast(`✅ Pago registrado: ${Fin.fmt(amount)} entre participantes`);
    go('participants', debtId);
  } catch (e) {
    showErr(e.message || 'Error al guardar');
  }
}

function confirmDeleteTransfer(transferId, debtId) {
  const t = S.participantTransfers.find(x => x.id === transferId);
  if (!t) return;
  if (!confirm(`¿Eliminar este registro de pago entre participantes?\n\nMonto: ${Fin.fmt(t.amount)}\nFecha: ${t.paid_date}\n\nEsto restablecerá el saldo entre los participantes.`)) return;
  DB.deleteParticipantTransfer(transferId).then(() => {
    UI.toast('Registro eliminado');
    go('participants', debtId);
  });
}

function renderEP(debtId) {
  const ed = document.getElementById('pe');
  if (!ed) return;
  ed.innerHTML = (window._ep || []).map((p, i) => `
  <div style="display:flex;gap:7px;align-items:center;padding:8px;background:var(--bg3s);border-radius:var(--r);margin-bottom:6px;border:1px solid var(--bd)">
    <input type="text"   value="${p.name||''}"  placeholder="Nombre" style="flex:1;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:6px 9px;color:var(--tx);font-family:var(--fm);font-size:12px;outline:none" oninput="window._ep[${i}].name=this.value">
    <input type="email"  value="${p.email||''}" placeholder="Email (opcional)" style="width:170px;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:6px 9px;color:var(--tx);font-family:var(--fm);font-size:12px;outline:none" oninput="window._ep[${i}].email=this.value">
    <input type="number" value="${p.pct||''}"   placeholder="%" min="0" max="100" step="0.5" style="width:60px;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:6px 8px;color:var(--tx);font-family:var(--fm);font-size:12px;outline:none;text-align:right" oninput="window._ep[${i}].pct=parseFloat(this.value)||0;updatePctTot()">
    <button class="btn bd_ btn-sm" onclick="removeEP(${i},'${debtId}')">✕</button>
  </div>`).join('') || `<div style="color:var(--tx3);font-size:12px;padding:8px">Sin participantes. Agrega uno.</div>`;

}

function addEP(debtId) {
  if (!window._ep) window._ep = [];
  window._ep.push({ id: 'np-' + Date.now(), debt_id: debtId, user_id: 'u-' + Date.now(), name: '', email: '', pct: 0 });
  renderEP(debtId);
}
function removeEP(i, debtId) { window._ep.splice(i, 1); renderEP(debtId); updateEPSum(debtId); }
function updatePctTot() {
  const tot = (window._ep || []).reduce((s, p) => s + (parseFloat(p.pct) || 0), 0);
  const el  = document.getElementById('pct-tot'), pw = document.getElementById('pw');
  const ok  = Math.abs(tot - 100) < 0.11;
  if (el)  { el.textContent = tot.toFixed(1) + '%'; el.style.background = ok ? 'var(--gnd)' : 'var(--rdd)'; el.style.color = ok ? 'var(--gn)' : 'var(--rd)'; }
  if (pw)  pw.classList.toggle('hidden', ok);
}
async function saveEP(debtId) {
  const tot = (window._ep || []).reduce((s, p) => s + (parseFloat(p.pct) || 0), 0);
  if (Math.abs(tot - 100) > 0.11) { UI.toast('Los % deben sumar 100%', 'error'); return; }
  const valid = (window._ep || []).filter(p => p.name && parseFloat(p.pct) > 0);
  await DB.saveParticipants(debtId, valid.map(p => ({ ...p, debt_id: debtId })));
  UI.toast('Participantes guardados ✅');
  const rows = Fin.annotated(debtId); updateEPSum(debtId, rows.find(r => r.status !== 'paid'));
}
function updateEPSum(debtId, nextRow) {
  const tb = document.getElementById('ep-sum');
  if (!tb) return;
  const debt = S.debts.find(d => d.id === debtId);
  const editList = (window._ep || []).filter(p => p.name && parseFloat(p.pct) > 0);
  if (!editList.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--tx3);padding:18px">Sin participantes</td></tr>'; return; }

  // Si los participantes en edición ya están guardados, podemos usar Fin.participantBalances
  // que considera correctamente las cuotas marcadas como pagadas
  const savedParts = S.parts.filter(p => p.debt_id === debtId);
  const allSaved = editList.every(ep => savedParts.some(sp => sp.id === ep.id));
  const balances = allSaved ? Fin.participantBalances(debtId) : null;

  tb.innerHTML = editList.map(pp => {
    const share = parseFloat(pp.pct) || 0;
    const owes  = (+debt?.total_amount || 0) * (share / 100);
    let ppaid;
    if (balances) {
      const b = balances.find(x => x.id === pp.id);
      ppaid = b ? b.real : 0;
    } else {
      // Fallback: solo cuenta pagos directos (no marca proporcional cuotas manuales)
      ppaid = S.instPayments.filter(p => p.part_id === pp.id && p.debt_id === debtId && Fin.isApproved(p))
        .reduce((s, p) => s + (+p.amount || 0), 0);
    }
    const due_  = Math.max(0, owes - ppaid);
    const nc    = nextRow ? nextRow.total * (share / 100) : 0;
    return `<tr><td class="tdm">${pp.name}</td><td class="tdn">${share}%</td><td class="tdn">${Fin.fmt(owes)}</td><td class="tdn txt-gn">${Fin.fmt(ppaid)}</td><td class="tdn ${due_ > 0 ? 'txt-rd' : ''} fw7">${Fin.fmt(due_)}</td><td class="tdn txt-am">${Fin.fmt(nc)}</td><td>${due_ <= 0.01 ? UI.chip('Al día', 'gn') : UI.chip('Debe', 'rd')}</td></tr>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   VIEW: DELINQUENCY
═══════════════════════════════════════════════════════════ */
function renderDelinquency() {
  // ── Recolectar cuotas atrasadas/parciales separando por dirección ──
  const overdueOut = []; // mis deudas atrasadas
  const overdueIn  = []; // cobros atrasados (incoming)

  S.debts.forEach(d => {
    if (!Fin.hasAmort(d)) return; // sin amort no aplica morosidad
    const isIn = Fin.isIncoming(d);
    Fin.annotated(d.id)
      .filter(a => a.status === 'overdue' || a.status === 'partial')
      .forEach(a => {
        const item = {
          ...a,
          debtName: d.name,
          debtId: d.id,
          borrower: d.borrower_name || null,
        };
        if (isIn) overdueIn.push(item); else overdueOut.push(item);
      });
  });

  // ── Participantes con saldo pendiente (solo en deudas outgoing) ──
  const partDue = [];
  S.debts.forEach(debt => {
    if (Fin.isIncoming(debt)) return;
    S.parts.filter(p => p.debt_id === debt.id).forEach(pp => {
      const { owes, paid, due } = Fin.partBalance(debt.id, pp.id);
      if (due > 0) partDue.push({ name: pp.name, debtName: debt.name, debtId: debt.id, owes, paid, due });
    });
  });

  // ── Métricas resumen ──
  const totOutOverdue = overdueOut.reduce((s, o) => s + (+o.total || 0), 0);
  const totInOverdue  = overdueIn.reduce((s, o)  => s + (+o.total || 0), 0);
  // Lo realmente atrasado (lo que falta de cada cuota, no el total de la cuota)
  const realOutOverdue = overdueOut.reduce((s, o) => s + (o.partialRemaining ?? o.total), 0);
  const realInOverdue  = overdueIn.reduce((s, o)  => s + (o.partialRemaining ?? o.total), 0);
  const netOverdue = realInOverdue - realOutOverdue;
  // Días promedio de atraso
  const avgDaysOut = overdueOut.length ? Math.round(overdueOut.reduce((s,o)=>s+Math.max(0,Fin.daysSince(o.due)), 0) / overdueOut.length) : 0;
  const avgDaysIn  = overdueIn.length  ? Math.round(overdueIn.reduce((s,o)=>s+Math.max(0,Fin.daysSince(o.due)), 0)  / overdueIn.length)  : 0;
  // Más antigua
  const oldestOut = overdueOut.length ? overdueOut.reduce((a,b) => a.due < b.due ? a : b) : null;
  const oldestIn  = overdueIn.length  ? overdueIn.reduce((a,b)  => a.due < b.due ? a : b) : null;

  document.getElementById('content').innerHTML = `
  <!-- ═══════ COMPARATIVA: lo que debo vs lo que me deben ═══════ -->
  <div class="card mb4" style="background:linear-gradient(135deg,${netOverdue >= 0 ? 'rgba(16,185,129,.06)' : 'rgba(239,68,68,.06)'} 0%,var(--bg2) 100%)">
    <div class="card-hd">
      <div>
        <div class="card-ti">📊 Resumen de Morosidad</div>
        <div class="card-su">Comparativa de lo que tengo atrasado vs lo que tienen atrasado conmigo</div>
      </div>
    </div>
    <div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:0">
      ${UI.kc('rd','Tengo atrasado', `<span class="txt-rd">${Fin.fmt(realOutOverdue, true)}</span>`, `${overdueOut.length} cuota${overdueOut.length!==1?'s':''} mía${overdueOut.length!==1?'s':''}`, '⚠️')}
      ${UI.kc('am','Me tienen atrasado', `<span class="txt-am">${Fin.fmt(realInOverdue, true)}</span>`, `${overdueIn.length} cuota${overdueIn.length!==1?'s':''} por cobrar`, '📍')}
      ${UI.kc(netOverdue >= 0 ? 'gn' : 'rd','Posición Neta', `<span class="${netOverdue >= 0 ? 'txt-gn' : 'txt-rd'}">${netOverdue>=0?'+':''}${Fin.fmt(netOverdue, true)}</span>`, netOverdue >= 0 ? 'a mi favor' : 'en contra', '⚖️')}
      ${UI.kc('pu','Participantes', partDue.length, 'con saldo pendiente', '👥')}
    </div>
  </div>

  <!-- ═══════ MIS DEUDAS ATRASADAS (outgoing) ═══════ -->
  <div class="card mb4" style="border-left:3px solid var(--rd)">
    <div class="card-hd">
      <div>
        <div class="card-ti" style="color:var(--rd)">⚠️ Mis Deudas Atrasadas</div>
        <div class="card-su">${overdueOut.length === 0 ? '🎉 No tienes nada atrasado' : `${overdueOut.length} cuota${overdueOut.length!==1?'s':''} · ${Fin.fmt(realOutOverdue, true)} pendiente${oldestOut?' · más antigua: '+oldestOut.due+' (#'+oldestOut.n+' de '+oldestOut.debtName+')':''}${avgDaysOut?' · '+avgDaysOut+' días promedio':''}`}</div>
      </div>
    </div>
    ${overdueOut.length ? `<div class="tw"><table>
      <thead><tr><th>Deuda</th><th>#</th><th>Vence</th><th>Días</th><th class="tdn">Capital</th><th class="tdn">Interés</th><th class="tdn">Cuota</th><th class="tdn">Pagado</th><th class="tdn">Falta</th><th>Estado</th><th></th></tr></thead>

// Toggle de "con/sin cuotas"
function onAmortKindChange() {
  const hasAmort = document.querySelector('input[name="dhas_amort"]:checked')?.value === 'yes';
  document.getElementById('amort-opts')?.classList.toggle('hidden', !hasAmort);
  document.getElementById('noamort-opts')?.classList.toggle('hidden', hasAmort);
  // Update visual styling
  const yes = document.getElementById('amrt-yes-lbl'), no = document.getElementById('amrt-no-lbl');
  if (yes) yes.style.borderColor = hasAmort ? 'var(--am)' : 'var(--bd2)';
  if (no)  no.style.borderColor  = hasAmort ? 'var(--bd2)' : 'var(--bl)';
  // Hint
  const hint = document.getElementById('amort-hint');
  if (hint) hint.textContent = hasAmort
    ? '💡 La tabla de amortización se genera automáticamente (sistema francés) · O puedes importarla desde CSV después'
    : '💡 No se generará tabla de cuotas. Registrarás abonos libres y la deuda se liquidará cuando el saldo llegue a cero.';
}

function onDirectionChange() {
  const dir = document.querySelector('input[name="ddir"]:checked')?.value || 'outgoing';
  document.getElementById('borrower-opts').classList.toggle('hidden', dir !== 'incoming');
  // Holder opts: visible siempre para third_party. Para outgoing también, opcional. Para incoming oculto.
  const holderEl = document.getElementById('holder-opts');
  if (holderEl) holderEl.classList.toggle('hidden', dir === 'incoming');
  // Update visual styling on labels
  const out = document.getElementById('dir-out-lbl'), inc = document.getElementById('dir-in-lbl'), tp = document.getElementById('dir-tp-lbl');
  if (out) out.style.borderColor = dir === 'outgoing' ? 'var(--rd)' : 'var(--bd2)';
  if (inc) inc.style.borderColor = dir === 'incoming' ? 'var(--gn)' : 'var(--bd2)';
  if (tp)  tp.style.borderColor  = dir === 'third_party' ? 'var(--bl)' : 'var(--bd2)';
}

function onDebtTypeChange() {
  const isCC = document.getElementById('dtype').value === 'credit_card';
  document.getElementById('cc-opts').classList.toggle('hidden', !isCC);
  const showAmort = !isCC || document.getElementById('dcc-amort')?.checked;
  document.getElementById('amort-opts').classList.toggle('hidden', isCC && !showAmort);
}

function calcCuota() {
  const p = parseFloat(document.getElementById('damt').value) || 0;
  const r = parseFloat(document.getElementById('drate').value) || 0;
  const n = parseInt(document.getElementById('dmonths').value) || 0;
  const ins = parseFloat(document.getElementById('dins')?.value) || 0;
  if (p && n) {
    const rm = r / 100 / 12;
    const c  = rm === 0 ? p / n : p * rm * Math.pow(1 + rm, n) / (Math.pow(1 + rm, n) - 1);
    const totalCuota = c + ins;
    const txt = ins > 0
      ? `${Fin.fmt(totalCuota)}  (cap+int ${Fin.fmt(c, true)} + seg ${Fin.fmt(ins, true)})`
      : Fin.fmt(totalCuota);
    document.getElementById('dcuota').value = txt;
  }
}

async function saveDebt() {
  const name   = document.getElementById('dn').value.trim();
  const type   = document.getElementById('dtype').value;
  const amt    = parseFloat(document.getElementById('damt').value);
  const rate   = parseFloat(document.getElementById('drate').value) || 0;
  const desc   = document.getElementById('dd').value.trim();
  const ccBal  = parseFloat(document.getElementById('dcc-bal')?.value) || 0;
  const ccAmort= document.getElementById('dcc-amort')?.checked || false;
  const direction = document.querySelector('input[name="ddir"]:checked')?.value || 'outgoing';
  const hasAmort  = (document.querySelector('input[name="dhas_amort"]:checked')?.value || 'yes') === 'yes';
  const monthlyIns = parseFloat(document.getElementById('dins')?.value) || 0;
  const borrowerName  = document.getElementById('d-bname')?.value.trim() || null;
  const borrowerEmail = document.getElementById('d-bemail')?.value.trim() || null;
  const holderName    = document.getElementById('d-hname')?.value.trim() || null;
  const holderEmail   = document.getElementById('d-hemail')?.value.trim() || null;

  // Fecha de inicio: depende de si hay amortización
  const start  = hasAmort
    ? document.getElementById('dstart').value
    : (document.getElementById('dstart-na')?.value || new Date().toISOString().split('T')[0]);
  const months = hasAmort ? (parseInt(document.getElementById('dmonths').value) || 0) : 0;

  if (!name || !amt) { const e = document.getElementById('derr'); e.textContent = 'Nombre y monto requeridos'; e.classList.remove('hidden'); return; }
  if (direction === 'incoming' && !borrowerName) { const e = document.getElementById('derr'); e.textContent = 'El nombre del deudor es requerido'; e.classList.remove('hidden'); return; }
  if (direction === 'third_party' && !holderName) { const e = document.getElementById('derr'); e.textContent = 'Para una deuda de tercero, el nombre del titular es requerido'; e.classList.remove('hidden'); return; }
  if (hasAmort && (!start || !months)) { const e = document.getElementById('derr'); e.textContent = 'Para deuda con cuotas: fecha de inicio y plazo son requeridos'; e.classList.remove('hidden'); return; }

  document.getElementById('bsd').disabled = true;
  try {
    const fwd = n => { const m = String(start).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; const d = new Date(+m[1], +m[2]-1, +m[3], 12); d.setMonth(d.getMonth() + n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    const publicToken = direction === 'incoming' ? ('tok_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36)) : null;
    await DB.createDebt({
      name, type, total_amount: amt, interest_rate: rate, start_date: start,
      end_date_estimated: (hasAmort && months) ? fwd(months) : null, description: desc,
      months: (hasAmort && (type !== 'credit_card' || ccAmort)) ? months : 0,
      cc_balance: ccBal, cc_has_amort: ccAmort,
      direction, public_token: publicToken,
      borrower_name: borrowerName, borrower_email: borrowerEmail,
      holder_name: holderName, holder_email: holderEmail,
      has_amort: hasAmort,
      monthly_insurance: monthlyIns,
    });
    UI.cm(); updateBadge();
    go(direction === 'incoming' ? 'receivables' : direction === 'third_party' ? 'third_party' : 'debts');
    UI.toast(`"${name}" creada ✅`);
  } catch (e) { const el = document.getElementById('derr'); el.textContent = e.message || 'Error'; el.classList.remove('hidden'); document.getElementById('bsd').disabled = false; }
}

async function saveEditedDebt(debtId) {
  const debt = S.debts.find(d => d.id === debtId);
  if (!debt) return UI.toast('Deuda no encontrada', 'error');

  const name   = document.getElementById('dn').value.trim();
  const type   = document.getElementById('dtype').value;
  const amt    = parseFloat(document.getElementById('damt').value);
  const rate   = parseFloat(document.getElementById('drate').value) || 0;
  const desc   = document.getElementById('dd').value.trim();
  const ccBal  = parseFloat(document.getElementById('dcc-bal')?.value) || 0;
  const ccAmort= document.getElementById('dcc-amort')?.checked || false;
  const direction = debt.direction || 'outgoing';
  const hasAmort  = Fin.hasAmort(debt); // ← se preserva, no se puede cambiar al editar
  const monthlyIns = parseFloat(document.getElementById('dins')?.value) || 0;
  const borrowerName  = document.getElementById('d-bname')?.value.trim() || null;
  const borrowerEmail = document.getElementById('d-bemail')?.value.trim() || null;
  const holderName    = document.getElementById('d-hname')?.value.trim() || null;
  const holderEmail   = document.getElementById('d-hemail')?.value.trim() || null;

  // Si la deuda es sin amortización, leer fecha del input alternativo
  const start  = hasAmort ? document.getElementById('dstart').value : (document.getElementById('dstart-na')?.value || debt.start_date);
  const months = hasAmort ? (parseInt(document.getElementById('dmonths').value) || 0) : 0;

  if (!name || !amt) { const e = document.getElementById('derr'); e.textContent = 'Nombre y monto requeridos'; e.classList.remove('hidden'); return; }
  if (direction === 'incoming' && !borrowerName) { const e = document.getElementById('derr'); e.textContent = 'El nombre del deudor es requerido'; e.classList.remove('hidden'); return; }

  // Normalizar fechas para comparación robusta (Supabase puede enviar 'YYYY-MM-DD' o con T)
  const normDate = s => { if (!s) return ''; const m = String(s).match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : ''; };
  const oldStart = normDate(debt.start_date);
  const newStart = normDate(start);

  // Detectar si cambian campos que afectan amortización (incluye seguro mensual)
  const oldIns = +debt.monthly_insurance || 0;
  const amortChanged = hasAmort && (
    (+debt.total_amount !== +amt) ||
    (+(debt.interest_rate || 0) !== +rate) ||
    (+(debt.months || 0) !== +months) ||
    (oldStart !== newStart) ||
    (oldIns !== monthlyIns)
  );
  const debtMonths = hasAmort ? ((type !== 'credit_card' || ccAmort) ? months : 0) : 0;
  const willHaveAmort = hasAmort && debtMonths > 0 && amt > 0 && start;

  let regen = false;
  if (amortChanged && willHaveAmort) {
    regen = confirm(
      '¿Regenerar la tabla de amortización?\n\n' +
      'Cambiaste monto/tasa/plazo/fecha/seguro. Los pagos ya registrados se conservan por número de cuota.\n\n' +
      'OK = Regenerar tabla\nCancelar = Solo actualizar datos sin tocar la tabla'
    );
  }

  document.getElementById('bsd').disabled = true;
  try {
    const fwd = n => { const m = String(start).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; const d = new Date(+m[1], +m[2]-1, +m[3], 12); d.setMonth(d.getMonth() + n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    const patch = {
      name, description: desc, type,
      total_amount: amt, interest_rate: rate, start_date: start,
      months: debtMonths, end_date_estimated: debtMonths ? fwd(debtMonths) : null,
      cc_balance: ccBal, cc_has_amort: ccAmort,
      borrower_name: borrowerName, borrower_email: borrowerEmail,
      holder_name: holderName, holder_email: holderEmail,
      has_amort: hasAmort,
      monthly_insurance: monthlyIns,
    };
    // Reintenta UPDATE retirando columnas opcionales que no existan
    const optionalCols = ['monthly_insurance', 'holder_name', 'holder_email'];
    let workingPatch = { ...patch };
    let attempt = 0;
    while (attempt < optionalCols.length + 1) {
      try {
        await DB.updateDebt(debtId, workingPatch);
        break; // éxito
      } catch (uerr) {
        const missing = optionalCols.find(col => new RegExp(col + '.*column|column.*' + col + '|schema cache', 'i').test(uerr.message || ''));
        if (!missing) throw uerr;
        UI.toast(`⚠️ Tu base no tiene "${missing}". Guardando sin ese campo.`, 'warn');
        delete workingPatch[missing];
        attempt++;
      }
    }
    if (regen) await DB.regenerateAmort(debtId, amt, rate, debtMonths, start, monthlyIns);

    UI.cm(); updateBadge();
    go(S.view, S.selDebt);
    UI.toast(`✏️ "${name}" actualizada${regen ? ' · tabla regenerada' : ''}`);
  } catch (e) {
    const el = document.getElementById('derr'); el.textContent = e.message || 'Error';
    el.classList.remove('hidden'); document.getElementById('bsd').disabled = false;
  }
}

    <div class="mbd"><p style="color:var(--tx2)">¿Eliminar "<strong>${d?.name}</strong>" junto con todos sus pagos y cuotas?</p><p style="color:var(--rd);margin-top:8px;font-size:12px">Esta acción no se puede deshacer.</p></div>
    <div class="mft"><button class="btn bs" onclick="UI.cm()">Cancelar</button><button class="btn bd_" onclick="doDel('${id}')">Eliminar</button></div>
  </div></div>`);
}
async function doDel(id) { await DB.deleteDebt(id); UI.cm(); updateBadge(); go('debts'); UI.toast('Deuda eliminada', 'warn'); }
