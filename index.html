/* ═══════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════ */
function authTab(tab) {
  document.querySelectorAll('.atab').forEach((t, i) =>
    t.classList.toggle('on', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
  document.getElementById('auth-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('auth-reg').classList.toggle('hidden', tab !== 'register');
  ['ae', 'as_'].forEach(id => document.getElementById(id).classList.add('hidden'));
}
function authMsg(msg, type) {
  const el = document.getElementById(type === 'e' ? 'ae' : 'as_');
  el.textContent = msg; el.classList.remove('hidden');
}

async function doLogin() {
  const email = document.getElementById('le').value.trim();
  const pass  = document.getElementById('lp').value;
  if (!email || !pass) return authMsg('Ingresa email y contraseña', 'e');
  if (!sb) return authMsg('Supabase no está configurado', 'e');
  document.getElementById('bl').disabled = true;
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    user = data.user; await initApp();
  } catch (e) { authMsg(e.message || 'Error al iniciar sesión', 'e'); document.getElementById('bl').disabled = false; }
}
async function doRegister() {
  const name = document.getElementById('rn').value.trim();
  const email = document.getElementById('re').value.trim();
  const pass  = document.getElementById('rp').value;
  if (!name || !email || !pass) return authMsg('Completa todos los campos', 'e');
  if (pass.length < 6) return authMsg('Contraseña mínimo 6 caracteres', 'e');
  if (!sb) return authMsg('Supabase no está configurado', 'e');
  document.getElementById('br').disabled = true;
  try {
    const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
    if (error) throw error;
    authMsg('Cuenta creada. Revisa tu email para confirmar (o inicia sesión si la confirmación está desactivada).', 's');
  } catch (e) { authMsg(e.message || 'Error', 'e'); }
  document.getElementById('br').disabled = false;
}
async function doLogout() {
  if (sb) await sb.auth.signOut();
  user = null;
  if (_pollingInterval) { clearInterval(_pollingInterval); _pollingInterval = null; }
  S = { debts: [], amorts: [], instPayments: [], payments: [], parts: [], participantTransfers: [], incomes: [], view: 'dashboard', selDebt: null };
  UI.destroyCharts();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

/* ═══════════════════════════════════════════════════════════
   DB LAYER
═══════════════════════════════════════════════════════════ */
const DB = {
  async loadAll() {
    if (!sb) return;
    setSyncStart();
    try {
      const uid = user.id;
      const [d, a, p, pp, ip, inc] = await Promise.all([
        sb.from('debts').select('*').eq('owner_user_id', uid),
        sb.from('amortizations').select('*'),
        sb.from('payments').select('*'),
        sb.from('participants').select('*'),
        sb.from('installment_payments').select('*'),
        sb.from('incomes').select('*').eq('user_id', uid),
      ]);
      // Si alguno tiene error, considerar como falla
      const err = [d,a,p,pp,ip,inc].find(r => r.error);
      if (err && err.error) throw err.error;
      S.debts = d.data || []; S.amorts = a.data || []; S.payments = p.data || [];
      S.parts = pp.data || []; S.instPayments = ip.data || []; S.incomes = inc.data || [];

      // Cargar participant_transfers (puede no existir si no se ha corrido el SQL nuevo)
      try {
        const pt = await sb.from('participant_transfers').select('*');
        S.participantTransfers = pt.data || [];
      } catch (e) {
        S.participantTransfers = [];
      }

      setSyncOk();
    } catch (e) {
      setSyncErr(e);
      throw e;
    }
  },

  async createDebt(data) {
    const d = { ...data, id: 'd-' + Date.now(), owner_user_id: user.id };

    // Construir las cuotas si aplica
    let amortsToInsert = [];
    if (data.has_amort !== false && data.months && data.total_amount && data.start_date) {
      amortsToInsert = Fin.buildAmort(+data.total_amount, +data.interest_rate || 0, +data.months, data.start_date, +data.monthly_insurance || 0)
        .map((r, i) => ({ ...r, id: `${d.id}_${i}`, debt_id: d.id, paid_date: null }));
    }

    // 1) Insertar primero la deuda en Supabase (puede fallar)
    if (sb) {
      // Quitar campos que pueden no existir en tu schema (monthly_insurance) — fallback gracioso
      let debtPayload = { ...d };
      // Reintenta el INSERT, removiendo columnas opcionales que no existan en el schema
      const optionalCols = ['monthly_insurance', 'holder_name', 'holder_email'];
      let attempt = 0;
      let lastErr = null;
      while (attempt < optionalCols.length + 1) {
        const { error } = await sb.from('debts').insert(debtPayload);
        if (!error) { lastErr = null; break; }
        lastErr = error;
        // ¿Es por una columna opcional faltante?
        const missing = optionalCols.find(col => new RegExp(col + '.*column|column.*' + col + '|schema cache', 'i').test(error.message || ''));
        if (!missing) break;
        console.warn(`Columna ${missing} no existe en debts. Reintentando sin ella.`);
        UI.toast(`⚠️ Tu base no tiene la columna "${missing}". Ejecuta el SQL nuevo. Se guarda sin ella.`, 'warn');
        delete debtPayload[missing];
        attempt++;
      }
      if (lastErr) throw lastErr;

      // 2) Insertar las amortizaciones (en lotes para fechas viejas con muchas cuotas)
      if (amortsToInsert.length) {
        const BATCH = 100;
        let stripInsurance = false;
        for (let i = 0; i < amortsToInsert.length; i += BATCH) {
          const chunk = amortsToInsert.slice(i, i + BATCH);
          const payload = stripInsurance ? chunk.map(({ insurance, ...rest }) => rest) : chunk;
          const { error: aErr } = await sb.from('amortizations').insert(payload);
          if (aErr) {
            if (!stripInsurance && /insurance.*column|column.*insurance|schema cache/i.test(aErr.message || '')) {
              stripInsurance = true;
              console.warn('Columna insurance no existe en amortizations. Insertando sin ella.');
              const retry = await sb.from('amortizations').insert(chunk.map(({ insurance, ...rest }) => rest));
              if (retry.error) {
                await sb.from('debts').delete().eq('id', d.id);
                throw new Error('Error al guardar la tabla de amortización: ' + retry.error.message);
              }
            } else {
              await sb.from('debts').delete().eq('id', d.id);
              throw new Error('Error al guardar la tabla de amortización: ' + aErr.message);
            }
          }
        }
      }
    }

    // 3) Actualizar estado local solo si Supabase tuvo éxito (o no hay sb)
    S.debts.push(d);
    amortsToInsert.forEach(r => S.amorts.push(r));
    return d;
  },

  async updateDebt(id, patch) {
    const idx = S.debts.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('Deuda no encontrada');
    S.debts[idx] = { ...S.debts[idx], ...patch };
    if (sb) {
      const { error } = await sb.from('debts').update(patch).eq('id', id);
      if (error) throw error;
    }
    return S.debts[idx];
  },

  // Regenera la amortización conservando los paid_date de cuotas ya pagadas (por número de cuota)
  async regenerateAmort(debtId, principal, rate, months, startDate, monthlyInsurance) {
    // Guardar paid_dates por número de cuota
    const oldPaid = {};
    S.amorts.filter(a => a.debt_id === debtId).forEach(a => { if (a.paid_date) oldPaid[a.n] = a.paid_date; });

    const newRows = Fin.buildAmort(+principal, +rate || 0, +months, startDate, +monthlyInsurance || 0)
      .map((r, i) => ({ ...r, id: `${debtId}_${i}`, debt_id: debtId, paid_date: oldPaid[r.n] || null }));

    // ⚠️ PROTECCIÓN: si la nueva tabla viene vacía (parámetros inválidos), NO borrar la vieja.
    if (newRows.length === 0) {
      throw new Error('No se pudo generar la nueva tabla. Verifica que monto, plazo y fecha sean válidos. La tabla anterior se conserva intacta.');
    }

    if (sb) {
      const { error: dErr } = await sb.from('amortizations').delete().eq('debt_id', debtId);
      if (dErr) throw new Error('Error al borrar tabla anterior: ' + dErr.message);
      const BATCH = 100;
      let stripInsurance = false;
      for (let i = 0; i < newRows.length; i += BATCH) {
        const chunk = newRows.slice(i, i + BATCH);
        const payload = stripInsurance ? chunk.map(({ insurance, ...rest }) => rest) : chunk;
        const { error: iErr } = await sb.from('amortizations').insert(payload);
        if (iErr) {
          if (!stripInsurance && /insurance.*column|column.*insurance|schema cache/i.test(iErr.message || '')) {
            stripInsurance = true;
            UI.toast('⚠️ Tu base no tiene la columna "insurance". Ejecuta el SQL nuevo.', 'warn');
            const retry = await sb.from('amortizations').insert(chunk.map(({ insurance, ...rest }) => rest));
            if (retry.error) throw new Error('Error al insertar tabla nueva: ' + retry.error.message);
          } else {
            throw new Error('Error al insertar tabla nueva: ' + iErr.message);
          }
        }
      }
    }

    // Actualizar estado local solo después de éxito en Supabase
    S.amorts = S.amorts.filter(a => a.debt_id !== debtId);
    newRows.forEach(r => S.amorts.push(r));
  },

  async createInstPayment(data) {
    const p = { ...data, id: 'ip-' + Date.now() };
    S.instPayments.push(p);
    if (sb) await sb.from('installment_payments').insert(p);
    return p;
  },

  async createGenericPayment(data) {
    const p = { ...data, id: 'gp-' + Date.now() };
    S.payments.push(p);
    if (sb) await sb.from('payments').insert(p);
    return p;
  },

  /* Aplica distribución automática: crea instPayments por cada cuota cubierta y
     marca como pagadas las que se completaron. Si sobra, crea un payment genérico
     "abono extra".
     - amount: total a distribuir
     - meta: { date, notes, receipt_url, status, reported_by, part_id }
  */
  async applyDistributedPayment(debtId, amount, meta) {
    const plan = Fin.planPaymentDistribution(debtId, amount);
    const status      = meta.status      || 'approved';
    const reported_by = meta.reported_by || 'owner';
    const debt        = S.debts.find(d => d.id === debtId);
    const created = { instPayments: [], genericPayments: [], markedPaid: [] };

    // 1) Crear instPayments por cuota cubierta
    for (const a of plan.allocations) {
      const ip = {
        id: 'ip-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        debt_id: debtId,
        amort_id: a.amort_id,
        part_id: meta.part_id || null,
        user_id: meta.user_id || (debt?.owner_user_id) || null,
        amount: a.allocated,
        paid_date: meta.date,
        notes: meta.notes ? `${meta.notes} (cuota #${a.n})` : `Distribuido — cuota #${a.n}`,
        receipt_url: meta.receipt_url || null,
        status, reported_by,
      };
      S.instPayments.push(ip);
      created.instPayments.push(ip);
      if (sb) await sb.from('installment_payments').insert(ip);

      // Solo marcar pagada si está aprobado Y completó la cuota
      if (a.willComplete && status === 'approved') {
        await DB.markAmortPaid(a.amort_id, meta.date);
        created.markedPaid.push(a.n);
      }
    }

    // 2) Si sobró dinero, registrar como pago genérico "extra"
    if (plan.extraAmount > 0.005) {
      const gp = {
        id: 'gp-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        debt_id: debtId,
        user_id: meta.user_id || null,
        amount: plan.extraAmount,
        payment_date: meta.date,
        notes: meta.notes ? `${meta.notes} (excedente sin cuota)` : 'Excedente sin cuota',
        receipt_url: meta.receipt_url || null,
        status, reported_by,
      };
      S.payments.push(gp);
      created.genericPayments.push(gp);
      if (sb) await sb.from('payments').insert(gp);
    }

    return { plan, created };
  },

  async updatePayment(table, id, patch) {
    const arr = table === 'installment_payments' ? S.instPayments : S.payments;
    const idx = arr.findIndex(p => p.id === id);
    if (idx !== -1) arr[idx] = { ...arr[idx], ...patch };
    if (sb) await sb.from(table).update(patch).eq('id', id);
  },

  /* ─── Storage: comprobantes de pago ─── */
  async uploadReceipt(file, debtId) {
    if (!sb) throw new Error('Supabase no configurado');
    if (!file) return null;
    if (file.size > 5 * 1024 * 1024) throw new Error('La imagen es muy grande (máx. 5MB)');
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    if (!['jpg','jpeg','png','webp','heic','heif','gif','pdf'].includes(ext)) throw new Error('Formato no soportado');
    // Path: {user_id}/{debt_id}/{timestamp}-{rand}.{ext}
    const path = `${user.id}/${debtId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await sb.storage.from('payment-receipts').upload(path, file, {
      contentType: file.type || 'image/jpeg',
      upsert: false,
    });
    if (error) throw error;
    const { data: pub } = sb.storage.from('payment-receipts').getPublicUrl(path);
    return pub.publicUrl;
  },

  async deleteReceipt(url) {
    if (!sb || !url) return;
    // Extraer el path desde la URL pública
    const m = url.match(/payment-receipts\/(.+)$/);
    if (!m) return;
    await sb.storage.from('payment-receipts').remove([m[1]]);
  },

  async createIncome(data) {
    const inc = { ...data, id: 'inc-' + Date.now(), user_id: user.id };
    S.incomes.push(inc);
    if (sb) await sb.from('incomes').insert(inc);
    return inc;
  },

  async deleteIncome(id) {
    S.incomes = S.incomes.filter(i => i.id !== id);
    if (sb) await sb.from('incomes').delete().eq('id', id);
  },

  async deletePayment(id) {
    S.payments = S.payments.filter(p => p.id !== id);
    if (sb) await sb.from('payments').delete().eq('id', id);
  },

  async deleteInstPayment(id) {
    S.instPayments = S.instPayments.filter(p => p.id !== id);
    if (sb) await sb.from('installment_payments').delete().eq('id', id);
  },

  // Eliminar TODOS los pagos asociados a una cuota específica (al desmarcar y limpiar)
  async deleteInstPaymentsByAmort(amortId) {
    const toDel = S.instPayments.filter(p => p.amort_id === amortId);
    S.instPayments = S.instPayments.filter(p => p.amort_id !== amortId);
    if (sb && toDel.length) {
      const { error } = await sb.from('installment_payments').delete().eq('amort_id', amortId);
      if (error) throw error;
    }
    return toDel.length;
  },

  async updateIncome(id, patch) {
    const idx = S.incomes.findIndex(i => i.id === id);
    if (idx !== -1) S.incomes[idx] = { ...S.incomes[idx], ...patch };
    if (sb) await sb.from('incomes').update(patch).eq('id', id);
  },

  async markAmortPaid(amortId, paidDate) {
    const a = S.amorts.find(x => x.id === amortId);
    if (a) a.paid_date = paidDate;
    if (sb) await sb.from('amortizations').update({ paid_date: paidDate }).eq('id', amortId);
  },

  async saveParticipants(debtId, list) {
    S.parts = S.parts.filter(p => p.debt_id !== debtId);
    list.forEach(p => S.parts.push(p));
    if (sb) {
      await sb.from('participants').delete().eq('debt_id', debtId);
      if (list.length) await sb.from('participants').insert(list);
    }
  },

  async createParticipantTransfer(data) {
    const t = { ...data, id: 'pt-' + Date.now() };
    S.participantTransfers.push(t);
    if (sb) {
      const { error } = await sb.from('participant_transfers').insert(t);
      if (error) {
        // Rollback local
        S.participantTransfers = S.participantTransfers.filter(x => x.id !== t.id);
        if (/participant_transfers.*does not exist|relation.*participant_transfers/i.test(error.message || '')) {
          throw new Error('Tu base de datos no tiene la tabla "participant_transfers". Ejecuta el SQL nuevo.');
        }
        throw error;
      }
    }
    return t;
  },

  async deleteParticipantTransfer(id) {
    S.participantTransfers = S.participantTransfers.filter(t => t.id !== id);
    if (sb) await sb.from('participant_transfers').delete().eq('id', id);
  },

  async deleteDebt(id) {
    ['debts', 'amorts', 'payments', 'instPayments', 'parts', 'participantTransfers'].forEach(k =>
      S[k] = S[k].filter(x => (x.id || x.debt_id) !== id && x.debt_id !== id));
    S.debts = S.debts.filter(d => d.id !== id);
    if (sb) await sb.from('debts').delete().eq('id', id);
  },

  async importAmortCSV(debtId, rows) {
    if (!rows || !rows.length) throw new Error('Sin filas para importar');
    // Renumerar IDs únicos para evitar colisiones
    const stamp = Date.now();
    const newRows = rows.map((r, i) => ({
      id: `${debtId}_${stamp}_${i}`,
      debt_id: debtId,
      n: +r.n || (i + 1),
      due: r.due || null,
      cap: +r.cap || 0,
      int: +r.int || 0,
      total: +r.total || ((+r.cap||0) + (+r.int||0) + (+r.insurance||0)),
      bal: +r.bal || 0,
      insurance: +r.insurance || 0,
      paid_date: r.paid_date || null,
    }));

    if (sb) {
      // Borrar primero los pagos asociados (para evitar FK rota)
      // Pero solo afectar amorts no instPayments
      const { error: dErr } = await sb.from('amortizations').delete().eq('debt_id', debtId);
      if (dErr) throw new Error('Error al borrar tabla anterior: ' + dErr.message);

      // Insertar en lotes para tablas grandes
      const BATCH = 100;
      let stripInsurance = false; // ¿la BD tiene la columna insurance?

      for (let i = 0; i < newRows.length; i += BATCH) {
        const chunk = newRows.slice(i, i + BATCH);
        const payload = stripInsurance
          ? chunk.map(({ insurance, ...rest }) => rest)
          : chunk;
        const { error: iErr } = await sb.from('amortizations').insert(payload);
        if (iErr) {
          // Detectar si es por la columna insurance faltante
          if (!stripInsurance && /insurance.*column|column.*insurance|schema cache/i.test(iErr.message || '')) {
            // Reintentar SIN insurance + avisar al usuario
            stripInsurance = true;
            console.warn('Columna insurance no existe en Supabase. Importando sin seguros. Ejecuta el SQL nuevo para habilitarla.');
            UI.toast('⚠️ Importando sin "seguros" porque tu base no está actualizada. Ejecuta el SQL nuevo.', 'warn');
            const retry = await sb.from('amortizations').insert(chunk.map(({ insurance, ...rest }) => rest));
            if (retry.error) throw new Error(`Error al insertar fila ${i+1}-${i+chunk.length}: ${retry.error.message}`);
          } else {
            throw new Error(`Error al insertar fila ${i+1}-${i+chunk.length}: ${iErr.message}`);
          }
        }
      }
    }

    // Actualizar estado local DESPUÉS de éxito en Supabase
    S.amorts = S.amorts.filter(a => a.debt_id !== debtId);
    newRows.forEach(r => S.amorts.push(r));
    return newRows.length;
  },
};

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
async function initApp() {
  UI.load(true);
  try {
    await DB.loadAll();
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    const name = user.user_metadata?.full_name || user.email || 'Usuario';
    document.getElementById('uname').textContent = name.split(' ')[0];
    document.getElementById('uav').textContent = name[0].toUpperCase();
    document.getElementById('uemail').textContent = user.email || '';
    updateBadge(); go('dashboard');
    startPendingPoller();
  } catch (e) { console.error(e); UI.toast('Error al cargar datos', 'error'); }
  UI.load(false);
}

// Polling para sincronizar con Supabase y detectar cambios de otros dispositivos/usuarios
let _pollingInterval = null;
let _lastPendingCount = 0;
function startPendingPoller() {
  if (_pollingInterval) clearInterval(_pollingInterval);
  _lastPendingCount = Fin.pendingPaymentsCount();
  // Cada 30s: full sync para que cambios desde otra compu/usuario aparezcan
  _pollingInterval = setInterval(async () => {
    if (!sb || !user || !_connState.online) return;
    if (document.hidden) return; // no sincronizar cuando la pestaña está oculta
    try {
      await DB.loadAll();
      const newCount = Fin.pendingPaymentsCount();
      if (newCount > _lastPendingCount) {
        UI.toast(`🔔 Nuevo pago notificado por aprobar (${newCount} pendientes)`, 'warn');
      }
      _lastPendingCount = newCount;
      updateBadge();
      // Solo re-renderizar si el usuario está mirando una vista que muestra estos datos
      if (S.view === 'approvals' || S.view === 'payments' || S.view === 'dashboard') {
        go(S.view, S.selDebt);
      }
    } catch (e) { /* el setSyncErr ya se llamó */ }
  }, 30000);
}

// Sincronizar al volver a la pestaña (visibilitychange)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && sb && user && _connState.online) {
    refreshFromDB(false).catch(() => {});
  }
});

function updateBadge() {
  // Morosidad: sumar atrasos de mis deudas + cobros atrasados
  const outOverdue = Fin.outgoingDebts().filter(d => Fin.hasAmort(d)).reduce((s, d) => s + Fin.overdueCount(d.id), 0);
  const inOverdue  = Fin.incomingDebts().filter(d => Fin.hasAmort(d)).reduce((s, d) => s + Fin.overdueCount(d.id), 0);
  const totalOverdue = outOverdue + inOverdue;
  const b = document.getElementById('dbadge');
  if (b) { b.textContent = totalOverdue; b.classList.toggle('hidden', totalOverdue === 0); b.title = `${outOverdue} mías · ${inOverdue} por cobrar`; }

  const inCount = Fin.incomingDebts().filter(d => Fin.remaining(d) > 0).length;
  const rb = document.getElementById('rbadge');
  if (rb) { rb.textContent = inCount; rb.classList.toggle('hidden', inCount === 0); }

  const tpCount = Fin.thirdPartyDebts().filter(d => Fin.remaining(d) > 0).length;
  const tpb = document.getElementById('tpbadge');
  if (tpb) { tpb.textContent = tpCount; tpb.classList.toggle('hidden', tpCount === 0); }

  // Pagos pendientes de aprobar
  const pendCount = Fin.pendingPaymentsCount();
  const ab = document.getElementById('abadge');
  if (ab) { ab.textContent = pendCount; ab.classList.toggle('hidden', pendCount === 0); }
}

function go(view, extra) {
  S.view = view; if (extra !== undefined) S.selDebt = extra;
  document.querySelectorAll('.ni').forEach(el => el.classList.toggle('on', el.dataset.v === view));
  const titles = { dashboard: 'Dashboard', income: 'Ingresos', debts: 'Mis Deudas', receivables: 'Cuentas por Cobrar', third_party: 'Deudas de Terceros', amort: 'Amortización', payments: 'Pagos', approvals: 'Aprobaciones', participants: 'Participantes', delinquency: 'Morosidad' };
  document.getElementById('ptitle').textContent = titles[view] || view;
  document.getElementById('tbactions').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  UI.destroyCharts();
  if (window.innerWidth <= 768) closeSidebar();
  ({ dashboard: renderDashboard, income: renderIncome, debts: renderDebts, receivables: renderReceivables, third_party: renderThirdParty, amort: renderAmort, payments: renderPayments, approvals: renderApprovals, participants: renderParticipants, delinquency: renderDelinquency }[view] || (() => {}))(extra);
}

/* ═══════════════════════════════════════════════════════════
   VIEW: DASHBOARD
═══════════════════════════════════════════════════════════ */
function renderDashboard() {
  const curM       = Fin.currentMonth();
  const outDebts   = Fin.outgoingDebts();
  const inDebts    = Fin.incomingDebts();

  // ── Estado de saldos (totales — siempre presentes, no dependen del rango) ──
  // CAPITAL: cuánto se debe realmente del capital original (no incluye intereses)
  const owedTotal  = outDebts.reduce((s, d) => s + (+d.total_amount || 0), 0);
  const owedCapPaid= outDebts.reduce((s, d) => s + Fin.paidCapital(d.id), 0);
  const owedIntPaid= outDebts.reduce((s, d) => s + Fin.paidInterest(d.id), 0);
  const owedPaid   = owedCapPaid + owedIntPaid; // total desembolsado (para mostrar info)
  const owedRem    = Math.max(0, owedTotal - owedCapPaid);
  const recvTotal  = inDebts.reduce((s, d) => s + (+d.total_amount || 0), 0);
  const recvCapPaid= inDebts.reduce((s, d) => s + Fin.paidCapital(d.id), 0);
  const recvIntPaid= inDebts.reduce((s, d) => s + Fin.paidInterest(d.id), 0);
  const recvPaid   = recvCapPaid + recvIntPaid;
  const recvRem    = Math.max(0, recvTotal - recvCapPaid);
  const netPos     = recvRem - owedRem;

  // ── Conteos de salud ──
  const overdueOut    = outDebts.reduce((s, d) => s + (Fin.hasAmort(d) ? Fin.overdueCount(d.id) : 0), 0);
  const overdueIn     = inDebts.reduce((s, d) => s + (Fin.hasAmort(d) ? Fin.overdueCount(d.id) : 0), 0);
  const liquidatedOut = outDebts.filter(d => Fin.remaining(d) <= 0.01).length;
  const liquidatedIn  = inDebts.filter(d => Fin.remaining(d) <= 0.01).length;
  const pendingApproval = Fin.pendingPaymentsCount();

  // ── RANGO TEMPORAL: detectar preset o custom ──
  const dr = S.dashRange || { preset: 'month' };
  const range = dr.preset ? Fin.rangePreset(dr.preset) : { from: dr.from, to: dr.to, label: 'Personalizado' };

  // ── KPIs por rango ──
  const incomeR    = Fin.totalIncomeRange(range);
  const collectedR = Fin.totalCollectedRange(range);
  const expensesR  = Fin.totalExpensesRange(range);
  const flowR      = incomeR + collectedR - expensesR;
  const incomeCt   = Fin.incomesCountRange(range);
  const paymentsCt = Fin.paymentsCountRange(range);
  const grossIn    = incomeR + collectedR; // entradas totales
  const savingsRate = grossIn > 0 ? Math.max(0, flowR/grossIn*100) : 0;
  const totalAvailable = incomeR + collectedR;

  // Periodo previo equivalente para comparación
  let prevRange = null;
  if (range.from && range.to) {
    const f = new Date(range.from), t = new Date(range.to);
    const days = Math.round((t - f) / 86400000) + 1;
    const prevTo = new Date(f); prevTo.setDate(prevTo.getDate() - 1);
    const prevFrom = new Date(prevTo); prevFrom.setDate(prevTo.getDate() - days + 1);
    prevRange = { from: prevFrom.toISOString().slice(0,10), to: prevTo.toISOString().slice(0,10) };
  }
  const prevIncome    = prevRange ? Fin.totalIncomeRange(prevRange)    : 0;
  const prevCollected = prevRange ? Fin.totalCollectedRange(prevRange) : 0;
  const prevExpenses  = prevRange ? Fin.totalExpensesRange(prevRange)  : 0;
  const prevFlow      = prevIncome + prevCollected - prevExpenses;

  const trendChip = (curr, prev) => {
    if (!prevRange) return '';
    if (Math.abs(curr - prev) < 0.01) return `<span class="ktrend neu">— sin cambio</span>`;
    const diff = curr - prev;
    const pctDiff = prev !== 0 ? Math.abs(diff/prev*100) : 100;
    const cls = diff > 0 ? 'up' : 'dn';
    const arr = diff > 0 ? '↑' : '↓';
    return `<span class="ktrend ${cls}">${arr} ${pctDiff.toFixed(0)}% vs anterior</span>`;
  };

  // ── Para los charts: últimos 12 meses ──
  const months = (() => {
    const arr = [];
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push(d.toISOString().slice(0,7));
    }
    return arr;
  })();

  // ── Botón activo del filtro ──
  const isActive = p => dr.preset === p ? 'active' : '';

  // ── Botones de filtros ──
  const rangeBar = `<div class="range-chips no-print">
    <label>Período:</label>
    <button class="range-chip ${isActive('today')}"   onclick="setDashRange('today')">Hoy</button>
    <button class="range-chip ${isActive('week')}"    onclick="setDashRange('week')">7 días</button>
    <button class="range-chip ${isActive('month')}"   onclick="setDashRange('month')">Mes actual</button>
    <button class="range-chip ${isActive('quarter')}" onclick="setDashRange('quarter')">3 meses</button>
    <button class="range-chip ${isActive('ytd')}"     onclick="setDashRange('ytd')">Este año</button>
    <button class="range-chip ${isActive('year')}"    onclick="setDashRange('year')">Último año</button>
    <button class="range-chip ${isActive('all')}"     onclick="setDashRange('all')">Todo el tiempo</button>
    <div class="sep"></div>
    <label>Personalizado:</label>
    <input type="date" id="dash-from" value="${range.from || ''}" onchange="setDashRangeCustom()" title="Desde">
    <input type="date" id="dash-to"   value="${range.to || ''}"   onchange="setDashRangeCustom()" title="Hasta">
    <div class="sep"></div>
    <button class="range-chip" style="background:var(--bl);color:#fff;border-color:var(--bl)" onclick="exportDashboardPDF()">📄 Exportar PDF</button>
  </div>`;

  // Top deudas
  const topOut = [...outDebts].map(d => ({...d, _rem: Fin.remaining(d)})).filter(d => d._rem > 0.01).sort((a,b) => b._rem - a._rem).slice(0,5);
  const topIn  = [...inDebts].map(d => ({...d, _rem: Fin.remaining(d)})).filter(d => d._rem > 0.01).sort((a,b) => b._rem - a._rem).slice(0,5);

  // ── Saldos a favor en deudas compartidas (cuando yo pagué de más en deudas mías) ──
  // El "owner" es typically el primer participante o el que tiene email del usuario.
  // Para simplificar: si hay un participante con email == user.email, ese soy yo.
  // Si no, asumimos que los settlements pendientes en MIS deudas son cobros para mí.
  const myPartCobros = [];
  outDebts.forEach(d => {
    const settlements = Fin.participantSettlements(d.id);
    const balances = Fin.participantBalances(d.id);
    const myEmail = (user?.email || '').toLowerCase();
    const me = balances.find(b => (b.email || '').toLowerCase() === myEmail);
    if (me && me.balance > 0.01) {
      // Sumar lo que me deben los demás (settlements donde el "to" soy yo)
      const owedToMe = settlements.filter(s => s.to === me.id).reduce((s, x) => s + x.amount, 0);
      if (owedToMe > 0.01) {
        myPartCobros.push({ debt: d, amount: owedToMe, mePart: me, settlements: settlements.filter(s => s.to === me.id) });
      }
    } else if (!me && balances.length >= 2) {
      // Si no encuentro un participante con mi email, uso el primer participante como "yo"
      // (es lo más común: tú pagas la deuda, agregas a otros como participantes)
      const myImpl = balances[0];
      if (myImpl && myImpl.balance > 0.01) {
        const owedToMe = settlements.filter(s => s.to === myImpl.id).reduce((s, x) => s + x.amount, 0);
        if (owedToMe > 0.01) {
          myPartCobros.push({ debt: d, amount: owedToMe, mePart: myImpl, settlements: settlements.filter(s => s.to === myImpl.id) });
        }
      }
    }
  });
  myPartCobros.sort((a,b) => b.amount - a.amount);

  // ── Préstamos al titular: cuando yo pagué deudas third_party o con holder marcadas como is_loan_to_holder ──
  const holderLoans = [];
  S.debts.forEach(d => {
    if (Fin.isIncoming(d)) return; // ya están en topIn
    const holder = d.holder_name;
    if (!holder) return;
    const loanedAmt = S.payments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0)
                    + S.instPayments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0);
    if (loanedAmt > 0.01) {
      holderLoans.push({ debt: d, holder, amount: loanedAmt });
    }
  });
  holderLoans.sort((a,b) => b.amount - a.amount);

  document.getElementById('content').innerHTML = `
  <!-- Header solo para PDF -->
  <div class="print-header">
    <h1>📊 DebtOS — Reporte Financiero</h1>
    <div class="meta">
      <strong>Usuario:</strong> ${user?.email || '—'}<br>
      <strong>Período:</strong> ${range.label}${range.from || range.to ? ' (' + (range.from||'inicio') + ' → ' + (range.to||'hoy') + ')' : ''}<br>
      <strong>Generado:</strong> ${new Date().toLocaleString('es-EC')}
    </div>
  </div>

  ${rangeBar}

  <!-- ═══════ SITUACIÓN GLOBAL (no depende del rango) ═══════ -->
  <div class="dash-section">
    <div class="dash-section-ti">💼 Situación Global — saldos actuales</div>
    <div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${UI.kc('rd','Yo Debo (capital)', `<span class="txt-rd">${Fin.fmt(owedRem, true)}</span>`, `${outDebts.length} deuda${outDebts.length!==1?'s':''} · ${overdueOut} atrasada${overdueOut!==1?'s':''}`, '🏦')}
      ${UI.kc('gn','Me Deben (capital)', `<span class="txt-gn">${Fin.fmt(recvRem, true)}</span>`, `${inDebts.length} deudor${inDebts.length!==1?'es':''} · ${overdueIn} atrasada${overdueIn!==1?'s':''}`, '💚')}
      ${UI.kc(netPos>=0?'gn':'rd','Posición Neta', `<span class="${netPos>=0?'txt-gn':'txt-rd'}">${netPos>=0?'+':''}${Fin.fmt(netPos, true)}</span>`, netPos>=0?'me deben más de lo que debo':'debo más de lo que me deben', '⚖️')}
      ${UI.kc('am','Avance Capital', owedTotal?(owedCapPaid/owedTotal*100).toFixed(1)+'%':'0%', Fin.fmt(owedCapPaid, true)+' de '+Fin.fmt(owedTotal,true), '✅')}
    </div>
    ${(owedIntPaid > 0 || recvIntPaid > 0) ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px">
      ${owedIntPaid > 0 ? `<div style="padding:9px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);font-size:11px;color:var(--tx2)">
        💸 <strong style="color:var(--am);font-family:var(--fmono)">${Fin.fmt(owedIntPaid)}</strong> pagados solo en intereses (no reduce capital)
      </div>` : ''}
      ${recvIntPaid > 0 ? `<div style="padding:9px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);font-size:11px;color:var(--tx2)">
        💰 <strong style="color:var(--gn);font-family:var(--fmono)">${Fin.fmt(recvIntPaid)}</strong> ganados en intereses
      </div>` : ''}
    </div>` : ''}
  </div>

  <!-- ═══════ MÉTRICAS DEL PERÍODO ═══════ -->
  <div class="dash-section">
    <div class="dash-section-ti">📅 Período: ${range.label}${range.from || range.to ? ' · '+(range.from||'inicio')+' → '+(range.to||'hoy') : ''}</div>
    <div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${UI.kc('cy','Ingresos', Fin.fmt(incomeR, true), `${incomeCt} registro${incomeCt!==1?'s':''}<br>${trendChip(incomeR, prevIncome)}`, '💰')}
      ${UI.kc('gn','Cobros', Fin.fmt(collectedR, true), `recibido de deudores<br>${trendChip(collectedR, prevCollected)}`, '📥')}
      ${UI.kc('rd','Pagos', Fin.fmt(expensesR, true), `${paymentsCt} pago${paymentsCt!==1?'s':''}<br>${trendChip(expensesR, prevExpenses)}`, '💸')}
      ${UI.kc(flowR>=0?'gn':'rd','Flujo Neto', `<span class="${flowR>=0?'txt-gn':'txt-rd'}">${flowR>=0?'+':''}${Fin.fmt(flowR, true)}</span>`, `entradas − pagos<br>${trendChip(flowR, prevFlow)}`, '📊')}
      ${UI.kc('pu','Total Entradas', Fin.fmt(grossIn, true), 'ingresos + cobros', '💵')}
      ${UI.kc('bl','Tasa de Ahorro', savingsRate.toFixed(1)+'%', flowR>=0?'parte de entradas no gastada':'gastando más que entradas', '💎')}
    </div>
  </div>

  <!-- ═══════ ALERTAS (visibles si hay algo) ═══════ -->
  ${(overdueOut > 0 || overdueIn > 0 || pendingApproval > 0) ? `
  <div class="dash-section">
    <div class="dash-section-ti">⚠️ Alertas</div>

function setDashRange(preset) {

function setDashRangeCustom() {
  const from = document.getElementById('dash-from')?.value || null;
  const to   = document.getElementById('dash-to')?.value   || null;
  if (!from && !to) return;
  // Validar: si ambas están, from no puede ser mayor a to
  if (from && to && from > to) {
    UI.toast('La fecha "desde" no puede ser mayor a "hasta"', 'error');
    return;
  }
  S.dashRange = { preset: null, from, to };
  renderDashboard();
}

/* ═══════════════════════════════════════════════════════════

   Útil para préstamos viejos donde quieres marcar muchas
   cuotas como pagadas de una sola vez sin registrar pagos.
═══════════════════════════════════════════════════════════ */
function modalBulkMarkPaid(debtId) {
  const debt = S.debts.find(d => d.id === debtId);
  if (!debt) return UI.toast('Deuda no encontrada', 'error');

  const rows = Fin.annotated(debtId);
  const today = new Date().toISOString().split('T')[0];
  const dueAndUnpaid = rows.filter(r => r.due && r.due <= today && r.status !== 'paid');
  if (!dueAndUnpaid.length) return UI.toast('No hay cuotas vencidas pendientes', 'info');

  // Próxima cuota futura, para mostrar como referencia
  const nextFuture = rows.find(r => r.due && r.due > today && r.status !== 'paid');

  UI.modal(`<div class="mover"><div class="modal" style="max-width:560px">
    <div class="mhd">
      <div class="mti">✅ Marcar varias cuotas como pagadas</div>
      <button class="mcl" onclick="UI.cm()">✕</button>
    </div>
    <div class="mbd">
      <div class="alrt ai" style="font-size:12px;margin-bottom:14px">
        <div style="font-weight:600;margin-bottom:4px">${debt.name}</div>
        <div style="color:var(--tx3);font-size:11px">
          ${dueAndUnpaid.length} cuota${dueAndUnpaid.length!==1?'s':''} vencida${dueAndUnpaid.length!==1?'s':''} sin pagar (cuota #${dueAndUnpaid[0].n} a #${dueAndUnpaid[dueAndUnpaid.length-1].n})${nextFuture ? ` · próxima cuota futura: #${nextFuture.n} (${nextFuture.due})` : ''}
        </div>
      </div>

      <div class="fg">
        <label>¿Hasta qué cuota marcar?</label>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;background:var(--bg3s)" class="bulk-opt">
            <input type="radio" name="bulkMode" value="today" checked onchange="updateBulkPreview('${debtId}')">
            <div style="flex:1">
              <div style="font-size:12.5px;font-weight:600">📅 Hasta hoy (${today})</div>
              <div style="font-size:10.5px;color:var(--tx3)">Marca todas las cuotas vencidas (${dueAndUnpaid.length})</div>
            </div>
          </label>
          <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;background:var(--bg3s)">
            <input type="radio" name="bulkMode" value="date" onchange="updateBulkPreview('${debtId}')">
            <div style="flex:1">
              <div style="font-size:12.5px;font-weight:600">📆 Hasta una fecha específica</div>
              <div style="font-size:10.5px;color:var(--tx3);margin-bottom:4px">Útil si pagaste hasta cierto mes</div>
              <input type="date" id="bulkDate" value="${today}" oninput="document.querySelector('input[name=bulkMode][value=date]').checked=true;updateBulkPreview('${debtId}')" style="font-size:11px;padding:4px 6px">
            </div>
          </label>
          <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;background:var(--bg3s)">
            <input type="radio" name="bulkMode" value="count" onchange="updateBulkPreview('${debtId}')">
            <div style="flex:1">
              <div style="font-size:12.5px;font-weight:600">🔢 Las primeras N cuotas</div>
              <div style="font-size:10.5px;color:var(--tx3);margin-bottom:4px">Marca exactamente las primeras N cuotas pendientes</div>
              <input type="number" id="bulkCount" min="1" max="${dueAndUnpaid.length}" value="${Math.min(dueAndUnpaid.length, 12)}" oninput="document.querySelector('input[name=bulkMode][value=count]').checked=true;updateBulkPreview('${debtId}')" style="font-size:11px;padding:4px 6px;width:80px">

        </div>
      </div>

      </div>

  // Initial preview

function getBulkRows(debtId) {
  const rows = Fin.annotated(debtId);
  const today = new Date().toISOString().split('T')[0];
  const dueAndUnpaid = rows.filter(r => r.due && r.due <= today && r.status !== 'paid');
  const mode = document.querySelector('input[name="bulkMode"]:checked')?.value || 'today';
  if (mode === 'today') {
    return dueAndUnpaid;
  }
  if (mode === 'date') {
    const cutoff = document.getElementById('bulkDate')?.value;
    if (!cutoff) return [];
    return rows.filter(r => r.due && r.due <= cutoff && r.status !== 'paid');
  }
  if (mode === 'count') {
    // Las primeras N cuotas pendientes (vencidas o no), ordenadas por número
    const pending = rows.filter(r => r.status !== 'paid');
    const n = parseInt(document.getElementById('bulkCount')?.value) || 0;
    return pending.slice(0, Math.max(0, n));
  }
  return [];
}

function updateBulkPreview(debtId) {
  const el = document.getElementById('bulkPreview');
  if (!el) return;
  const target = getBulkRows(debtId);
  if (!target.length) {
    el.innerHTML = '<span style="color:var(--tx3)">Sin cuotas seleccionadas</span>';
    return;
  }
  const sumTotal = target.reduce((s, r) => s + (+r.total || 0), 0);
  const sumCap   = target.reduce((s, r) => s + (+r.cap   || 0), 0);
  const sumInt   = target.reduce((s, r) => s + (+r.int   || 0), 0);
  const first = target[0], last = target[target.length - 1];
  el.innerHTML = `
    <div style="font-weight:600;margin-bottom:4px">📋 Se marcarán ${target.length} cuota${target.length!==1?'s':''}</div>
    <div style="color:var(--tx3);font-size:11px">
      Cuota #${first.n} (${first.due}) → cuota #${last.n} (${last.due})
    </div>
    <div style="display:flex;gap:12px;margin-top:6px;font-size:11px;flex-wrap:wrap">
      <div>📊 Total: <strong style="font-family:var(--fmono)">${Fin.fmt(sumTotal, true)}</strong></div>
      <div>✅ Capital: <strong class="txt-gn" style="font-family:var(--fmono)">${Fin.fmt(sumCap, true)}</strong></div>
      <div>💰 Interés: <strong class="txt-am" style="font-family:var(--fmono)">${Fin.fmt(sumInt, true)}</strong></div>
    </div>
  `;
}

async function confirmBulkMarkPaid(debtId) {
  const target = getBulkRows(debtId);
  if (!target.length) return UI.toast('Nada que marcar', 'warn');

  const paidDateMode = document.getElementById('bulkPaidDateMode')?.value || 'due';
  const today = new Date().toISOString().split('T')[0];
  const btn = document.getElementById('btn-bulk-confirm');
  const errEl = document.getElementById('bulkErr');
  if (errEl) errEl.classList.add('hidden');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Marcando...'; }

  let okCount = 0, errCount = 0, lastErr = '';
  try {
    for (const r of target) {
      const paidDate = paidDateMode === 'today' ? today : (r.due || today);
      try {
        await DB.markAmortPaid(r.id, paidDate);
        okCount++;
      } catch (e) {
        errCount++;
        lastErr = e.message || 'desconocido';
      }
    }
    UI.cm();
    go('amort', debtId);
    if (errCount === 0) {
      UI.toast(`✅ ${okCount} cuota${okCount!==1?'s':''} marcada${okCount!==1?'s':''} como pagada${okCount!==1?'s':''}`);
    } else {
      UI.toast(`⚠️ ${okCount} marcadas · ${errCount} con error: ${lastErr}`, 'warn');
    }
  } catch (e) {
    if (errEl) {
      errEl.textContent = '❌ ' + (e.message || 'Error');
      errEl.classList.remove('hidden');
    }
    if (btn) { btn.disabled = false; btn.textContent = '✅ Marcar como pagadas'; }
  }
}


async function repairAmortTable(debtId) {
  const debt = S.debts.find(d => d.id === debtId);
  if (!debt) return UI.toast('Deuda no encontrada', 'error');
  if (!debt.months || !debt.total_amount || !debt.start_date) {
    return UI.toast('Faltan datos: monto, plazo o fecha de inicio', 'error');
  }
  const ins = +debt.monthly_insurance || 0;
  const ok = confirm(
    '¿Regenerar la tabla de amortización?\n\n' +
    `Deuda: ${debt.name}\n` +
    `Monto: $${debt.total_amount} · Tasa: ${debt.interest_rate||0}% · Plazo: ${debt.months} meses\n` +
    `Fecha inicio: ${debt.start_date}` +
    (ins > 0 ? `\nSeguro mensual: $${ins}` : '') +
    '\n\nLos pagos ya registrados se conservan por número de cuota.'
  );
  if (!ok) return;
  try {
    UI.toast('🔧 Regenerando tabla...', 'info');
    await DB.regenerateAmort(debtId, debt.total_amount, debt.interest_rate || 0, debt.months, debt.start_date, ins);
    go('amort', debtId);
    UI.toast(`✅ Tabla regenerada con ${debt.months} cuotas`);
  } catch (e) {
    UI.toast('❌ Error: ' + (e.message || 'desconocido'), 'error');
  }
}

function filterIncomes() {
  const cat   = document.getElementById('flt-cat')?.value   || '';
  const month = document.getElementById('flt-inc-month')?.value || '';
  let rows = [...S.incomes];
  if (cat)   rows = rows.filter(i => i.category === cat);
  if (month) rows = rows.filter(i => i.month === month);

  // Sort
  rows = sortRows(rows, S.sort.incomes, (a, b, col) => {
    if (col === 'amount') return (parseFloat(a.amount)||0) - (parseFloat(b.amount)||0);
    return undefined;
  });

  // Headers (clickeable para ordenar)
  const thead = document.getElementById('inc-thead');
  if (thead) thead.innerHTML = `<tr>
    ${sortHeader('Fecha',       'date',        'incomes', 'filterIncomes')}
    ${sortHeader('Descripción', 'description', 'incomes', 'filterIncomes')}
    ${sortHeader('Categoría',   'category',    'incomes', 'filterIncomes')}
    ${sortHeader('Monto',       'amount',      'incomes', 'filterIncomes', 'tdn')}
    <th></th>
  </tr>`;

  const tbody = document.getElementById('inc-tbody');
  if (!tbody) return;
  tbody.innerHTML = rows.length ? rows.map(i => `<tr>
    <td>${i.date || '—'}</td>
    <td class="tdm">${i.description || '—'}</td>
    <td>${UI.catChip(i.category)}</td>
    <td class="tdn txt-gn fw7">${Fin.fmt(i.amount)}</td>
    <td style="white-space:nowrap">
      <button class="btn bghost btn-sm" onclick="modalIncomeForm('${i.id}')" title="Editar">✏️</button>
      <button class="btn bghost btn-sm" onclick="confirmDelIncome('${i.id}')" title="Eliminar">🗑</button>
    </td>
  </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--tx3);padding:26px">Sin ingresos en este filtro</td></tr>`;
}

function confirmDelIncome(id) {

async function saveIncome() {
  const amt  = parseFloat(document.getElementById('i-amt').value);
  const date = document.getElementById('i-date').value;
  const cat  = document.getElementById('i-cat').value;
  const desc = document.getElementById('i-desc').value.trim();
  if (!amt || !date) { const e = document.getElementById('ierr'); e.textContent = 'Monto y fecha requeridos'; e.classList.remove('hidden'); return; }
  const month = date.slice(0, 7);
  document.getElementById('bsi').disabled = true;
  try {
    await DB.createIncome({ amount: amt, date, category: cat, description: desc || cat, month });
    UI.cm(); renderIncome(); UI.toast(`Ingreso de ${Fin.fmt(amt)} registrado 💰`);
  } catch (e) { const el = document.getElementById('ierr'); el.textContent = e.message || 'Error'; el.classList.remove('hidden'); document.getElementById('bsi').disabled = false; }
}

function renderThirdParty() {
  document.getElementById('tbactions').innerHTML = `<button class="btn bs btn-sm" style="background:var(--bl);color:#fff;border-color:var(--bl)" onclick="modalCreateDebt('third_party')">+ Nueva Deuda de Tercero</button>`;

  if (!debts.length) {
    document.getElementById('content').innerHTML = `

        <strong>👤 Deudas de Terceros</strong> — Aquí registras deudas que <strong>no son tuyas</strong> pero quieres llevar el control (ej: la deuda de tu hermano con el banco). Si pagas algo, al registrar el pago puedes elegir si lo cuentas como préstamo al titular (cobrarle después) o solo como seguimiento.
      </div>` + UI.empty('👤', 'Sin deudas de terceros', 'Registra deudas ajenas para llevar su control', '+ Nueva Deuda de Tercero', "modalCreateDebt('third_party')");
    return;
  }

  // KPIs agregados
  const totalDebt    = debts.reduce((s, d) => s + (+d.total_amount || 0), 0);
  const totalCapPaid = debts.reduce((s, d) => s + Fin.paidCapital(d.id), 0);
  const totalRem     = Math.max(0, totalDebt - totalCapPaid);
  const overdueCount = debts.reduce((s, d) => s + (Fin.hasAmort(d) ? Fin.overdueCount(d.id) : 0), 0);
  // Lo que YO he pagado de estas deudas (todas las deudas third_party tienen pagos míos)
  const myPayments   = debts.reduce((s, d) => s + Fin.totalPaid(d.id), 0);
  // Lo que ME deben los titulares (solo los pagos marcados como is_loan_to_holder)
  let owedToMe = 0;
  debts.forEach(d => {
    owedToMe += S.payments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0);
    owedToMe += S.instPayments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0);
  });
  // Restar lo que el titular ya me devolvió (registrado como participant_transfer? Por ahora simple: no descontar)

  const kpis = `<div class="kgrid mb4">
    ${UI.kc('bl','Total seguimiento', Fin.fmt(totalDebt, true), debts.length+' deuda'+(debts.length!==1?'s':''), '👤')}

    ${UI.kc('am','Pendiente', Fin.fmt(totalRem, true), overdueCount?overdueCount+' cuotas atrasadas':'aún por pagar', '⏳')}
    ${UI.kc(owedToMe > 0 ? 'gn' : 'cy','Yo pagué', Fin.fmt(myPayments, true), owedToMe > 0 ? `${Fin.fmt(owedToMe, true)} prestado al titular` : 'solo seguimiento', '💸')}
  </div>`;

  document.getElementById('content').innerHTML = kpis + `<div class="dcgrid">${debts.map(d => {
    const hasA  = Fin.hasAmort(d);
    const total = +d.total_amount || 0;
    const bd    = Fin.paidBreakdown(d.id);
    const capRem= Math.max(0, total - bd.capital);
    const pct   = total ? Math.min(100, (bd.capital / total) * 100) : 0;
    const ov    = hasA ? Fin.overdueCount(d.id) : 0;
    // Lo prestado al titular en esta deuda
    const loanedToHolder = S.payments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0)
                        + S.instPayments.filter(p => p.debt_id === d.id && p.is_loan_to_holder && Fin.isApproved(p)).reduce((s, p) => s + (+p.amount || 0), 0);
    const subtypeChip = hasA
      ? '<span style="display:inline-block;font-size:9px;color:var(--am);background:var(--amd);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle">📋 Con cuotas</span>'
      : '<span style="display:inline-block;font-size:9px;color:var(--bl);background:var(--bld);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle">💸 Libre</span>';
    return `<div class="dc" style="border-left:3px solid var(--bl)">
      <div class="dc-type" style="background:var(--bld);color:var(--bl)">De tercero${subtypeChip}</div>
      <div class="dc-name">${d.name}</div>
      <div class="dc-desc">${d.holder_name ? '👤 Titular: <strong>'+d.holder_name+'</strong>' : (d.description || '—')}${d.holder_email ? ' · '+d.holder_email : ''}</div>
      <div class="dc-total">${Fin.fmt(total)}</div>
      <div style="font-size:11px;color:var(--tx3)">Capital pendiente: <strong class="txt-am">${Fin.fmt(capRem)}</strong></div>
      <div class="pbar" style="margin-top:8px"><div class="pfill ${pct > 80 ? 'gn' : ''}" style="width:${pct}%"></div></div>
      <div style="font-size:9px;color:var(--tx3);text-align:right;margin-top:2px">${pct.toFixed(1)}% pagado</div>

/* ═══════════════════════════════════════════════════════════
   VIEW: RECEIVABLES (cuentas por cobrar)
═══════════════════════════════════════════════════════════ */
function renderReceivables() {
  document.getElementById('tbactions').innerHTML = `<button class="btn bg btn-sm" onclick="modalCreateDebt('incoming')">+ Nueva por Cobrar</button>`;
  const debts = Fin.incomingDebts();

  // Cálculos correctos: capital amortizado vs capital pendiente
  const totalReceivable = debts.reduce((s, d) => s + (+d.total_amount || 0), 0);
  let totalCapCollected = 0, totalIntCollected = 0;
  debts.forEach(d => {
    const bd = Fin.paidBreakdown(d.id);
    totalCapCollected += bd.capital;
    totalIntCollected += bd.interest;
  });
  const totalPending  = Math.max(0, totalReceivable - totalCapCollected);
  const overdueCount  = debts.reduce((s, d) => s + (Fin.hasAmort(d) ? Fin.overdueCount(d.id) : 0), 0);

  const kpis = `<div class="kgrid mb4">
    ${UI.kc('gn','Por cobrar (capital total)', Fin.fmt(totalReceivable, true), debts.length+' deudor'+(debts.length!==1?'es':''), '💚')}
    ${UI.kc('cy','Capital cobrado', Fin.fmt(totalCapCollected, true), Fin.pct(totalCapCollected,totalReceivable).toFixed(1)+'% del capital', '📥')}
    ${UI.kc('pu','Interés cobrado', Fin.fmt(totalIntCollected, true), 'extra al capital', '💰')}
    ${UI.kc('am','Capital pendiente', Fin.fmt(totalPending, true), overdueCount?overdueCount+' cuotas atrasadas':'aún por cobrar', '⏳')}
  </div>`;

  if (!debts.length) {
    document.getElementById('content').innerHTML = kpis + UI.empty('💚', 'Sin cuentas por cobrar', 'Registra deudas que otras personas te deben a ti', '+ Nueva por Cobrar', "modalCreateDebt('incoming')");
    return;
  }

  document.getElementById('content').innerHTML = kpis + `<div class="dcgrid">${debts.map(d => {
    const hasA  = Fin.hasAmort(d);
    const total = +d.total_amount || 0;
    const bd    = Fin.paidBreakdown(d.id);
    const capRem= Math.max(0, total - bd.capital);
    const pct   = total ? Math.min(100, (bd.capital / total) * 100) : 0;
    const ov    = hasA ? Fin.overdueCount(d.id) : 0;
    const subtypeChip = hasA
      ? '<span style="display:inline-block;font-size:9px;color:var(--am);background:var(--amd);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle">📋 Con cuotas</span>'
      : '<span style="display:inline-block;font-size:9px;color:var(--bl);background:var(--bld);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle">💸 Libre</span>';
    return `<div class="dc" style="border-left:3px solid var(--gn)">
      <div class="dc-type" style="background:var(--gnd);color:var(--gn)">Me deben${subtypeChip}</div>
      <div class="dc-name">${d.name}</div>
      <div class="dc-desc">${d.borrower_name ? '👤 '+d.borrower_name : (d.description || '—')}${d.borrower_email ? ' · '+d.borrower_email : ''}</div>
      <div class="dc-total txt-gn">${Fin.fmt(total)}</div>
      <div style="font-size:11px;color:var(--tx3)">Capital pendiente: <strong class="txt-am">${Fin.fmt(capRem)}</strong></div>
      <div class="pbar" style="margin-top:8px"><div class="pfill gn" style="width:${pct}%"></div></div>
      <div style="font-size:9px;color:var(--tx3);text-align:right;margin-top:2px">${pct.toFixed(1)}% capital cobrado</div>
      ${hasA ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding:7px 9px;background:var(--bg3s);border-radius:6px">
        <div><div style="font-size:9px;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase">Capital cobrado</div><div style="font-family:var(--fmono);font-size:12px;font-weight:700;color:var(--gn)">${Fin.fmt(bd.capital, true)}</div></div>
        <div><div style="font-size:9px;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase">Interés cobrado</div><div style="font-family:var(--fmono);font-size:12px;font-weight:700;color:var(--am)">${Fin.fmt(bd.interest, true)}</div></div>

        <div><div style="font-size:9px;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase">Total cobrado</div><div style="font-family:var(--fmono);font-size:12px;font-weight:700;color:var(--gn)">${Fin.fmt(bd.capital, true)}</div></div>

      <div class="dc-meta">

      </div>

/* ── Public link helpers ── */
function publicLinkFor(debtId) {
  const d = S.debts.find(x => x.id === debtId);
  if (!d || !d.public_token) return null;
  // Build URL relative to current location (works on local file:// and on hosted)
  const base = location.href.split('?')[0].split('#')[0].replace(/\/[^\/]*$/, '/');
  return `${base}public.html?token=${encodeURIComponent(d.public_token)}`;
}

async function copyPublicLink(debtId) {
  const d = S.debts.find(x => x.id === debtId);
  if (!d) return;
  if (!d.public_token) {
    d.public_token = 'tok_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    if (sb) await sb.from('debts').update({ public_token: d.public_token }).eq('id', debtId);
  }
  const url = publicLinkFor(debtId);
  try {
    await navigator.clipboard.writeText(url);
    UI.toast('🔗 Link copiado al portapapeles');
  } catch {
    // Fallback: show modal with URL
    modalShareLink(debtId);
  }
}

function modalShareLink(debtId) {
  const d = S.debts.find(x => x.id === debtId);
  if (!d) return;
  if (!d.public_token) {
    d.public_token = 'tok_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    if (sb) sb.from('debts').update({ public_token: d.public_token }).eq('id', debtId);
  }
  const url = publicLinkFor(debtId);
  UI.modal(`<div class="mover"><div class="modal" style="max-width:520px">
    <div class="mhd"><div class="mti">🔗 Compartir link público — ${d.name}</div><button class="mcl" onclick="UI.cm()">✕</button></div>
    <div class="mbd">
      <div class="alrt ai">
        Comparte este link con <strong>${d.borrower_name || 'el deudor'}</strong> para que pueda ver el estado de la deuda en tiempo real.
        <br><span style="font-size:11px;color:var(--tx3)">Solo lectura · sin login · token único</span>
      </div>
      <div class="fg">
        <label>URL pública</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="share-url" value="${url}" readonly onclick="this.select()" style="flex:1">
          <button class="btn bp btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('share-url').value).then(()=>UI.toast('Copiado'))">📋</button>
        </div>
      </div>
      <div class="fg">
        <label>Token (privado — no compartas excepto vía link)</label>
        <input type="text" value="${d.public_token}" readonly style="opacity:.6">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn bs btn-sm" onclick="window.open(document.getElementById('share-url').value,'_blank')">👁️ Vista previa</button>
        <button class="btn bd_ btn-sm" onclick="regenToken('${debtId}')">🔄 Regenerar token</button>
      </div>
      ${d.borrower_email ? `<div class="alrt as_" style="margin-top:10px">
        💡 Tip: envía este link a <strong>${d.borrower_email}</strong> por email o WhatsApp.
      </div>` : ''}
    </div>
    <div class="mft"><button class="btn bp" onclick="UI.cm()">Cerrar</button></div>
  </div></div>`);
}

async function regenToken(debtId) {
  const d = S.debts.find(x => x.id === debtId);
  if (!d) return;
  d.public_token = 'tok_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  if (sb) await sb.from('debts').update({ public_token: d.public_token }).eq('id', debtId);
  UI.toast('Token regenerado · el link anterior dejó de funcionar', 'warn');
  modalShareLink(debtId);
}

          const pct = (+pp.pct || 0) / 100;
          // Pagos directos con part_id en esta cuota
          const directPays = ipRows.filter(p => p.part_id === pp.id).reduce((s, p) => s + (+p.amount || 0), 0);
          // El "remainder" cubierto sin pagos detallados (ej: cuota marcada manual sin pagos)
          const directTotal = ipRows.filter(p => p.part_id).reduce((s, p) => s + (+p.amount || 0), 0);
          const covered = r.paid_date ? r.total : (r.instTotal || 0);
          const remainder = Math.max(0, covered - directTotal);
          const ppPay = directPays + remainder * pct;
          const exp_  = r.total * pct;
          const cls_  = ppPay >= exp_ * 0.99 ? 'paid' : (covered > 0 || r.status !== 'pending') ? 'due' : '';
          return `<span class="pp-badge ${cls_}" title="${pp.name}: ${Fin.fmt(ppPay)} / ${Fin.fmt(exp_)}">${pp.name.split(' ')[0]} ${Fin.fmt(ppPay, true)}</span>`;
        }).join('') : '';

        // Mostrar info de pago parcial
        const partialInfo = r.status === 'partial'
          ? `<div style="font-size:10px;color:var(--am);margin-top:2px">
               <span class="txt-gn">${Fin.fmt(r.instTotal,true)} pagado</span>
               · <span class="txt-rd">falta ${Fin.fmt(r.partialRemaining,true)}</span>
             </div>` : '';

        // Pagos pendientes de aprobación (notificados por deudor)
        const pendBadge = (r.pendingPays && r.pendingPays.length)
          ? `<div style="font-size:10px;color:var(--am);margin-top:2px;font-weight:600">⏳ ${r.pendingPays.length} pago${r.pendingPays.length>1?'s':''} por aprobar</div>` : '';

        // Indicador visual del tipo de "pagada"
        let estadoExtra = '';
        if (r.status === 'paid') {
          if (r.paid_date) estadoExtra = '<div style="font-size:9px;color:var(--gn);margin-top:1px">✓ marcada manualmente</div>';
          else estadoExtra = '<div style="font-size:9px;color:var(--gn);margin-top:1px">✓ por pagos acumulados</div>';
        }

        return `<tr class="${rc}" oncontextmenu="ctxAmortRow(event,'${debtId}','${r.id}','${r.status}')" data-amort-id="${r.id}">
          <td class="tdm">${r.n}</td>
          <td>${r.due}</td>
          <td style="color:${r.paid_date ? 'var(--gn)' : 'var(--tx3)'}">${r.paid_date || '—'}</td>
          <td class="tdn">${Fin.fmt(r.cap)}</td>
          <td class="tdn">${Fin.fmt(r.int)}</td>
          ${hasInsuranceCol ? `<td class="tdn" style="color:${(+r.insurance||0)>0?'var(--pu)':'var(--tx3)'}">${(+r.insurance||0)>0?Fin.fmt(r.insurance):'—'}</td>` : ''}
          <td class="tdn fw7">${Fin.fmt(r.total)}${partialInfo}${pendBadge}</td>
          <td class="tdn">${Fin.fmt(r.bal)}</td>
          <td>${UI.stChip(r.status)}${estadoExtra}</td>
          ${parts.length ? `<td>${ppBadges || '<span class="txt-mu" style="font-size:9px">—</span>'}</td>` : ''}
          <td class="tdc"><button class="btn bp btn-xs" onclick="event.stopPropagation();openAmortActions('${debtId}','${r.id}')" title="Ver y modificar acciones de esta cuota" style="white-space:nowrap">⚙ Acciones</button></td>
        </tr>`;
      }).join('') : `<tr><td colspan="${(parts.length ? 10 : 9) + (hasInsuranceCol ? 1 : 0)}" style="text-align:center;color:var(--tx3);padding:28px">
        ${(debt.months > 0 && debt.total_amount > 0 && debt.start_date) ? `
          <div style="margin-bottom:10px">⚠️ La deuda tiene <strong>${debt.months}</strong> cuotas configuradas pero la tabla está vacía.</div>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn bg btn-sm" onclick="repairAmortTable('${debtId}')">🔧 Generar tabla automáticamente</button>
            <button class="btn bs btn-sm" onclick="modalImportCSV('${debtId}')">📂 Importar CSV</button>
          </div>
        ` : `Sin cuotas. <a style="color:var(--am);cursor:pointer" onclick="modalImportCSV('${debtId}')">Importar CSV →</a>`}
      </td></tr>`}</tbody>
    </table></div>
  </div>`;
}

function ctxAmortRow(e, debtId, amortId, status) {
  if (e && e.preventDefault) e.preventDefault();
  if (e && e.stopPropagation) e.stopPropagation();
  openAmortActions(debtId, amortId);
}

function openAmortActions(debtId, amortId) {
  const amort = S.amorts.find(a => a.id === amortId);
  const debt  = S.debts.find(d => d.id === debtId);
  if (!amort || !debt) return UI.toast('Cuota no encontrada', 'error');

  const parts = S.parts.filter(p => p.debt_id === debtId);
  const annot = Fin.annotated(debtId).find(x => x.id === amortId);
  const status = annot?.status || 'pending';
  const numPays = annot?.allInstPays?.length || 0;
  const numApprovedPays = annot?.instPays?.length || 0;
  const numPendingPays  = annot?.pendingPays?.length || 0;
  const isManuallyPaid = !!amort.paid_date;
  const isPaidByPays   = status === 'paid' && !isManuallyPaid;
  const isOverdue      = status === 'overdue';
  const isPartial      = status === 'partial';
  const isPending      = status === 'pending';

  // Estado actual visual
  let badge = '';
  if (status === 'paid') {
    badge = isManuallyPaid
      ? '<span class="chip cgn">✓ Pagada (marca manual)</span>'
      : '<span class="chip cgn">✓ Pagada (por pagos acumulados)</span>';
  } else if (isOverdue)  badge = '<span class="chip crd">⚠ Atrasada</span>';
  else if (isPartial)    badge = '<span class="chip cam">◐ Parcial</span>';
  else                   badge = '<span class="chip cbl">○ Pendiente</span>';

  // Construir secciones por categoría
  const sections = [];

  // ─── SECCIÓN 1: ACCIONES DE PAGO (si NO está pagada) ───
  if (status !== 'paid') {
    const payActions = [];
    payActions.push({
      ico: '✅', lbl: 'Marcar como pagada (sin registrar pago)',
      desc: 'Solo cambia el estado a "pagada" con fecha de hoy',
      cls: 'gn', fn: `markPaid('${amortId}','${debtId}',null);UI.cm()`
    });
    payActions.push({
      ico: '📅', lbl: 'Marcar pagada con fecha específica',
      desc: 'Cambia estado a "pagada" pero con la fecha que tú elijas',
      cls: 'gn', fn: `UI.cm();modalMarkPaid('${amortId}','${debtId}')`
    });
    payActions.push({
      ico: '💸', lbl: 'Registrar pago real de esta cuota',
      desc: 'Crea un registro de pago con monto, fecha, notas y comprobante',
      cls: 'bp', fn: `UI.cm();modalInstPayment('${debtId}','${amortId}',null)`
    });
    if (parts.length) {
      parts.forEach(pp => {
        payActions.push({
          ico: '👤', lbl: `Pago de ${pp.name}`,
          desc: `${pp.pct}% · ${Fin.fmt(amort.total * (pp.pct / 100))}`,
          cls: 'bp', fn: `UI.cm();modalInstPayment('${debtId}','${amortId}','${pp.id}')`
        });
      });
    }
    sections.push({ title: '💰 Registrar pago', items: payActions });
  }

  // ─── SECCIÓN 2: DESMARCAR / REVERTIR (si SÍ está pagada o hay pagos) ───
  const undoActions = [];
  if (isManuallyPaid) {
    undoActions.push({
      ico: '↩️', lbl: 'Desmarcar (volver a pendiente)',
      desc: numPays > 0
        ? `Quita la marca manual. Los ${numPays} pago${numPays!==1?'s':''} registrado${numPays!==1?'s':''} se conservan.`
        : 'Quita la marca de pagada y vuelve a pendiente',
      cls: 'am', fn: `UI.cm();unmarkAmort('${amortId}','${debtId}',false)`
    });
  }
  if (numPays > 0) {
    undoActions.push({
      ico: '🗑', lbl: `Eliminar todos los pagos (${numPays})`,
      desc: 'Elimina permanentemente todos los pagos asociados a esta cuota. Si estaba marcada como pagada, vuelve a pendiente.',
      cls: 'rd', fn: `UI.cm();unmarkAmort('${amortId}','${debtId}',true)`
    });
  }
  if (undoActions.length) sections.push({ title: '↩️ Revertir / Desmarcar', items: undoActions });

  // ─── SECCIÓN 3: VER INFORMACIÓN ───
  const infoActions = [];
  if (numPays > 0) {
    infoActions.push({
      ico: '🔍', lbl: `Ver pagos de esta cuota (${numPays})`,
      desc: `${numApprovedPays} aprobado${numApprovedPays!==1?'s':''}${numPendingPays?', '+numPendingPays+' por aprobar':''}. Permite eliminar pagos individuales.`,
      cls: 'bs', fn: `UI.cm();showInstPayments('${amortId}')`
    });
  }
  if (status !== 'paid') {
    infoActions.push({
      ico: '➕', lbl: 'Abono genérico a la deuda',
      desc: 'Hace un abono que se distribuye automáticamente entre cuotas pendientes',
      cls: 'bs', fn: `UI.cm();modalGenericPay('${debtId}')`
    });
  }
  if (infoActions.length) sections.push({ title: 'ℹ️ Otras acciones', items: infoActions });

  // Construir HTML del modal
  const sectionsHtml = sections.map(sec => `
    <div style="margin-bottom:14px">
      <div style="font-size:10px;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;font-weight:600;margin-bottom:6px;padding-left:2px">${sec.title}</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${sec.items.map(it => `
          <button class="amort-action-btn" onclick="${it.fn}" data-cls="${it.cls}">
            <div class="aab-ico">${it.ico}</div>
            <div class="aab-body">
              <div class="aab-lbl">${it.lbl}</div>
              <div class="aab-desc">${it.desc}</div>
            </div>
            <div class="aab-arrow">›</div>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');

  UI.modal(`<div class="mover"><div class="modal" style="max-width:560px">
    <div class="mhd">
      <div class="mti">Cuota #${amort.n} — Acciones</div>
      <button class="mcl" onclick="UI.cm()">✕</button>
    </div>
    <div class="mbd">
      <div class="alrt ai" style="margin-bottom:14px;font-size:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px">
          <div>
            <div style="font-weight:600;color:var(--tx)">${debt.name}</div>
            <div style="color:var(--tx3);font-size:11px;margin-top:2px">Vence: ${amort.due} · Cuota: ${Fin.fmt(amort.total)}${isPartial?` · Pagado: <span class="txt-gn">${Fin.fmt(annot.instTotal||0)}</span> · Falta: <span class="txt-rd">${Fin.fmt(annot.partialRemaining||amort.total)}</span>`:''}</div>
          </div>
          <div>${badge}</div>
        </div>
      </div>
      ${sectionsHtml || '<div class="alrt aw">Sin acciones disponibles para esta cuota.</div>'}
    </div>
    <div class="mft">
      <button class="btn bs" onclick="UI.cm()">Cerrar</button>
    </div>
  </div></div>`);
}

async function markPaid(amortId, debtId, mode) {
  const date = mode === 'unmark' ? null : new Date().toISOString().split('T')[0];
  try {
    await DB.markAmortPaid(amortId, date);
    updateBadge(); go('amort', debtId);
    UI.toast(mode === 'unmark' ? 'Cuota desmarcada' : '✅ Cuota marcada como pagada', mode === 'unmark' ? 'warn' : 'success');
  } catch (e) {
    UI.toast('❌ Error: ' + (e.message || 'desconocido'), 'error');
  }
}

/**
 * Desmarca una cuota como pagada, manejando ambos casos:
 *  - cleanPays = false → solo borra el paid_date manual (los pagos asociados se conservan;
 *                      si la cuota seguía pagada por pagos acumulados, mantendrá ese estado)
 *  - cleanPays = true  → además elimina TODOS los pagos asociados (vuelve a pendiente garantizado)
 */
async function unmarkAmort(amortId, debtId, cleanPays) {
  const amort = S.amorts.find(a => a.id === amortId);
  if (!amort) return UI.toast('Cuota no encontrada', 'error');
  const annot = Fin.annotated(debtId).find(x => x.id === amortId);
  const numPays = annot?.allInstPays?.length || 0;

  let confirmMsg;
  if (cleanPays) {
    confirmMsg = numPays > 0
      ? `¿Eliminar todos los pagos de la cuota #${amort.n} y volverla a pendiente?\n\n` +
        `Se eliminarán ${numPays} pago${numPays!==1?'s':''}.\nEsta acción no se puede deshacer.`
      : `¿Volver la cuota #${amort.n} a pendiente?`;
  } else {
    confirmMsg = `¿Quitar la marca de "pagada" en la cuota #${amort.n}?\n\n` +
      (numPays > 0 ? `Los ${numPays} pago${numPays!==1?'s':''} registrado${numPays!==1?'s':''} se conservarán.` : '');
  }
  if (!confirm(confirmMsg)) return;

  try {
    if (cleanPays) {
      // Eliminar todos los pagos primero
      const n = await DB.deleteInstPaymentsByAmort(amortId);
      // Limpiar también el paid_date manual
      await DB.markAmortPaid(amortId, null);
      UI.toast(`✓ Cuota #${amort.n} liberada · ${n} pago${n!==1?'s':''} eliminado${n!==1?'s':''}`, 'warn');
    } else {
      // Solo limpiar paid_date (los pagos quedan)
      await DB.markAmortPaid(amortId, null);
      // Si después de quitar el flag los pagos acumulados aún la marcan como pagada, avisar
      const newAnnot = Fin.annotated(debtId).find(x => x.id === amortId);
      if (newAnnot?.status === 'paid') {
        UI.toast('⚠️ La cuota sigue marcada como pagada por sus pagos acumulados. Usa "Eliminar todos sus pagos" para liberarla.', 'warn');
      } else {
        UI.toast(`↩️ Cuota #${amort.n} desmarcada`, 'warn');
      }
    }
    updateBadge();
    go('amort', debtId);
  } catch (e) {
    UI.toast('❌ Error: ' + (e.message || 'desconocido'), 'error');
  }
}

function modalMarkPaid(amortId, debtId) {
  const today = new Date().toISOString().split('T')[0];

    <div class="mbd"><div class="fg"><label>¿Cuándo se pagó?</label><input type="date" id="mpd" value="${today}"></div></div>
    <div class="mft"><button class="btn bs" onclick="UI.cm()">Cancelar</button><button class="btn bg" onclick="doMarkPaidDate('${amortId}','${debtId}')">✅ Confirmar</button></div>
  </div></div>`);
}
async function doMarkPaidDate(amortId, debtId) {

  try {
    await DB.markAmortPaid(amortId, date);

    UI.toast('✅ Cuota pagada el ' + date);
  } catch (e) {
    UI.toast('❌ Error: ' + (e.message || 'desconocido'), 'error');
  }
}

function modalInstPayment(debtId, amortId, partId) {
  const amort  = S.amorts.find(a => a.id === amortId);
  const debt   = S.debts.find(d => d.id === debtId);
  if (!amort || !debt) {
    UI.toast(`❌ ${!amort ? 'Cuota' : 'Deuda'} no encontrada. Recarga la página o sincroniza.`, 'error');
    return;
  }
  const parts  = S.parts.filter(p => p.debt_id === debtId);
  const part   = partId ? S.parts.find(p => p.id === partId) : null;
  const today  = new Date().toISOString().split('T')[0];
  const cuotaTotal = +amort.total || 0;

  // Cuánto se ha pagado YA en esta cuota (todos los participantes)
  const allInstPaysAmort = S.instPayments.filter(p => p.amort_id === amortId && Fin.isApproved(p));
  const totalPaidThisCuota = allInstPaysAmort.reduce((s, p) => s + (+p.amount || 0), 0);
  const cuotaRemaining     = Math.max(0, cuotaTotal - totalPaidThisCuota);

  // Lo que debe pagar este "actor" (participante o todos)
  const exp_   = part ? cuotaTotal * ((+part.pct || 0) / 100) : cuotaTotal;
  const alreadyPaid = partId
    ? allInstPaysAmort.filter(p => p.part_id === partId).reduce((s, p) => s + (+p.amount || 0), 0)
    : totalPaidThisCuota;
  const remaining_ = part
    ? Math.max(0, exp_ - alreadyPaid)
    : cuotaRemaining;

  // Info de cada participante para mostrar el estado actual
  const partsInfo = parts.map(pp => {
    const paidByPp = allInstPaysAmort.filter(p => p.part_id === pp.id).reduce((s, p) => s + (+p.amount || 0), 0);
    const expPp = cuotaTotal * ((+pp.pct || 0) / 100);
    const remPp = Math.max(0, expPp - paidByPp);
    const overpaid = Math.max(0, paidByPp - expPp);
    return { ...pp, paid: paidByPp, expected: expPp, remaining: remPp, overpaid };
  });

  const infoBlock = parts.length ? `
